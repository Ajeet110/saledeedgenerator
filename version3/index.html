<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>6-Page Sale Deed Word &amp; A4 Document Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>

@layer base {
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #F4F1EA;
    color: #18181B;
    margin: 0;
    padding: 0;
  }
}

.font-mono-num {
  font-family: 'JetBrains Mono', monospace;
  font-variant-numeric: tabular-nums;
}

/* Exact A4 Paper Sheet Styles matching the 6 reference scans */
.a4-page {
        counter-increment: deedPage continuationPage;
  position: relative;
  width: 210mm;
  min-height: 297mm;
  height: 297mm;
  background: #FFFFFF;
  color: #000000;
  font-family: Verdana, Geneva, Tahoma, sans-serif;
  font-size: 11pt;
  line-height: 1.65;
  padding: 24mm 22mm 20mm 24mm;
  box-sizing: border-box;
  position: relative;
  box-shadow: 0 12px 32px -4px rgba(24, 24, 27, 0.14), 0 2px 6px -1px rgba(24, 24, 27, 0.08);
  border: 1px solid #D4D4D8;
  margin-left: auto;
  margin-right: auto;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.a4-page::before { content: "-::" counter(deedPage) "::-"; display: block; text-align: center; font-family: Georgia, serif; font-size: 10.5pt; font-weight: 600; margin: 0 0 12pt 0; color: #111827; }
      .a4-page::after {
        content: "Contd..." counter(continuationPage) "/-";
        position: absolute;
        right: 34px;
        bottom: 24px;
        font-family: "Times New Roman", serif;
        font-size: 10pt;
        color: #000;
      }
      .a4-page[data-deed-page="8"]::after { content: none; }

.a4-page-active {
  box-shadow: 0 16px 40px -4px rgba(30, 58, 138, 0.22), 0 0 0 2px #1E3A8A;
}

/* Table on Page 1 matching reference image 1 */
.deed-table {
  width: 100%;
  border-collapse: collapse;
  border: 1.25px solid #000000;
  font-family: Verdana, Geneva, Tahoma, sans-serif;
  font-size: 10.5pt;
  line-height: 1.35;
}

.deed-table tr {
  border-bottom: 1px solid #000000;
}

.deed-table td {
  padding: 7px 10px;
  vertical-align: top;
  color: #000000;
}

.deed-table td:first-child {
  width: 52%;
}

.deed-table td:last-child {
  width: 48%;
}

/* Dynamic field highlight on screen (invisible in print/word) */
.live-field {
  border-radius: 3px;
  transition: background-color 0.25s ease, box-shadow 0.25s ease;
}

.show-highlights .live-field {
  background-color: rgba(254, 243, 199, 0.75);
  box-shadow: 0 0 0 1px rgba(217, 119, 6, 0.35);
  padding: 0 2px;
}

.show-highlights .live-field-active {
  background-color: rgba(219, 234, 254, 0.95);
  box-shadow: 0 0 0 2px #1E3A8A;
  padding: 0 2px;
}

/* Custom subtle scrollbars */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: rgba(228, 226, 221, 0.5);
}
::-webkit-scrollbar-thumb {
  background: #A1A1AA;
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: #71717A;
}

/* Print / Save as PDF styles: outputs all 8 A4 pages cleanly */
@media print {
  @page {
    size: A4 portrait;
    margin: 0mm;
  }

  html, body {
    background: #FFFFFF !important;
    margin: 0 !important;
    padding: 0 !important;
    width: 210mm !important;
  }

  .no-print {
    display: none !important;
  }

  .print-container {
    display: block !important;
    padding: 0 !important;
    margin: 0 !important;
    background: transparent !important;
    overflow: visible !important;
    height: auto !important;
  }

  .print-scale-reset {
    transform: none !important;
  }

  .a4-page {
    width: 210mm !important;
    height: 297mm !important;
    min-height: 297mm !important;
    margin: 0 !important;
    box-shadow: none !important;
    border: none !important;
    page-break-after: always !important;
    break-after: page !important;
    page-break-inside: avoid !important;
    break-inside: avoid !important;
  }

  .a4-page:last-child {
    page-break-after: auto !important;
    break-after: auto !important;
  }

  .live-field,
  .show-highlights .live-field,
  .show-highlights .live-field-active {
    background-color: transparent !important;
    box-shadow: none !important;
    padding: 0 !important;
  }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.28.6/babel.min.js"></script>
<script type="module">
import * as ReactNS from "https://esm.sh/react@19.2.6";
import * as ReactDOMClient from "https://esm.sh/react-dom@19.2.6/client?deps=react@19.2.6";
import * as Lucide from "https://esm.sh/lucide-react@1.66.0?deps=react@19.2.6";
import * as Docx from "https://esm.sh/docx@9.15.1";
const sourceFiles = {"src/App.tsx":"import { useMemo, useRef, useState } from 'react';\nimport {\n  Download,\n  Eye,\n  FileDown,\n  FileText,\n  Highlighter,\n  Printer,\n  Scale,\n  Sparkles,\n  ZoomIn,\n  ZoomOut,\n} from 'lucide-react';\nimport { A4DocumentPreview } from './components/A4DocumentPreview';\nimport { DeedFormSidebar } from './components/DeedFormSidebar';\nimport { INITIAL_SALE_DEED_DATA, SaleDeedData } from './types/deed';\nimport {\n  calculateDeedMetrics,\n  formatIndianNumber,\n  formatSqMtr,\n} from './utils/calculations';\nimport { exportToClassicDoc, exportToDocx } from './utils/wordExport';\n\nexport function App() {\n  const [deedData, setDeedData] = useState<SaleDeedData>(INITIAL_SALE_DEED_DATA);\n  const [activeTab, setActiveTab] = useState<number>(1);\n  const [selectedPageFilter, setSelectedPageFilter] = useState<number | 'all'>('all');\n  const [showHighlights, setShowHighlights] = useState<boolean>(true);\n  const [zoom, setZoom] = useState<number>(0.85);\n  const [isExportingDocx, setIsExportingDocx] = useState<boolean>(false);\n  const [mobileView, setMobileView] = useState<'split' | 'form' | 'preview'>('split');\n\n  const pageRefs = useRef<(HTMLDivElement | null)[]>([]);\n  const previewScrollContainerRef = useRef<HTMLDivElement | null>(null);\n\n  const metrics = useMemo(() => calculateDeedMetrics(deedData), [deedData]);\n\n  const handleFieldChange = <K extends keyof SaleDeedData>(\n    key: K,\n    value: SaleDeedData[K]\n  ) => {\n    setDeedData((prev) => ({\n      ...prev,\n      [key]: value,\n    }));\n  };\n\n  const handleBatchUpdate = (updates: Partial<SaleDeedData>) => {\n    setDeedData((prev) => ({\n      ...prev,\n      ...updates,\n    }));\n  };\n\n  const handleResetDefaults = () => {\n    setDeedData(INITIAL_SALE_DEED_DATA);\n    setSelectedPageFilter('all');\n  };\n\n  const handleScrollToPage = (pageNumber: number) => {\n    if (selectedPageFilter !== 'all' && selectedPageFilter !== pageNumber) {\n      setSelectedPageFilter(pageNumber);\n      return;\n    }\n    const targetEl = pageRefs.current[pageNumber - 1];\n    if (targetEl) {\n      targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });\n    }\n  };\n\n  const handleSelectSectionFromPreview = (tabIndex: number) => {\n    setActiveTab(tabIndex);\n  };\n\n  const handleDownloadDocx = async () => {\n    try {\n      setIsExportingDocx(true);\n      await exportToDocx(deedData, metrics);\n    } finally {\n      setIsExportingDocx(false);\n    }\n  };\n\n  const handleDownloadClassicDoc = () => {\n    exportToClassicDoc(deedData, metrics);\n  };\n\n  const handlePrintA4 = () => {\n    // Ensure all 8 pages are rendered when printing\n    if (selectedPageFilter !== 'all') {\n      setSelectedPageFilter('all');\n      setTimeout(() => {\n        window.print();\n      }, 150);\n    } else {\n      window.print();\n    }\n  };\n\n  return (\n    <div className=\"min-h-screen lg:h-screen flex flex-col bg-[#F4F1EA] text-zinc-900 overflow-x-hidden\">\n      {/* ==================== STICKY TOP HEADER BAR ==================== */}\n      <header className=\"no-print sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-zinc-200 px-3 sm:px-5 py-2.5 shadow-2xs\">\n        <div className=\"flex flex-wrap items-center justify-between gap-3\">\n          {/* Brand Title */}\n          <div className=\"flex items-center gap-2.5\">\n            <div className=\"w-9 h-9 rounded-xl bg-[#1E3A8A] text-white flex items-center justify-center shadow-xs\">\n              <Scale className=\"w-5 h-5\" />\n            </div>\n            <div>\n              <div className=\"flex items-center gap-2\">\n                <h1 className=\"text-sm sm:text-base font-bold text-zinc-900 tracking-tight\">\n                  8-Page Sale Deed Word Generator\n                </h1>\n                <span className=\"hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-900 border border-amber-300\">\n                  A4 Legal Format\n                </span>\n              </div>\n              <p className=\"text-[11px] text-zinc-500 hidden sm:block\">\n                Auto-calculates Plot Sq.Yds → Sq.Mtr, Valuation &amp; Stamp Duty +\n                Seller, Buyer, Property &amp; Witnesses\n              </p>\n            </div>\n          </div>\n\n          {/* Instant 40 Yds <-> 50 Yds Quick Switcher in Header */}\n          <div className=\"flex items-center gap-1.5 bg-blue-50/90 border border-blue-200 px-2.5 py-1 rounded-xl\">\n            <Sparkles className=\"w-3.5 h-3.5 text-[#1E3A8A] shrink-0\" />\n            <span className=\"text-[11px] font-semibold text-zinc-700 mr-1\">\n              Plot Size:\n            </span>\n            {[40, 50, 52].map((yds) => (\n              <button\n                key={yds}\n                type=\"button\"\n                onClick={() => {\n                  handleBatchUpdate({\n                    plotAreaSqYds: yds,\n                    propertySqYdsPage2:\n                      yds === 40 && !deedData.syncPropertySqYdsWithPage1 ? 52 : yds,\n                  });\n                  handleScrollToPage(1);\n                }}\n                className={`px-2 py-1 rounded-lg text-xs font-bold font-mono-num transition-all cursor-pointer ${\n                  Number(deedData.plotAreaSqYds) === yds\n                    ? 'bg-[#1E3A8A] text-white shadow-2xs'\n                    : 'bg-white text-zinc-700 hover:bg-blue-100 border border-zinc-200'\n                }`}\n              >\n                {yds} Yds\n              </button>\n            ))}\n            <div className=\"hidden md:flex items-center gap-1.5 pl-2 ml-1 border-l border-blue-200 text-xs\">\n              <span className=\"text-zinc-500\">=</span>\n              <span className=\"font-mono-num font-bold text-emerald-800\">\n                {formatSqMtr(metrics.plotAreaSqMtr)} Sq.Mtr\n              </span>\n              <span className=\"text-zinc-400\">|</span>\n              <span className=\"font-mono-num font-bold text-[#1E3A8A]\">\n                Rs.{formatIndianNumber(metrics.stampDutyPaidOnAmount)}/-\n              </span>\n            </div>\n          </div>\n\n          {/* Primary Export & Print Buttons */}\n          <div className=\"flex items-center gap-2\">\n            <button\n              type=\"button\"\n              onClick={handleDownloadDocx}\n              disabled={isExportingDocx}\n              className=\"inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-[#1E3A8A] hover:bg-blue-900 text-white font-semibold text-xs shadow-xs transition-all cursor-pointer disabled:opacity-60\"\n            >\n              <FileDown className=\"w-4 h-4\" />\n              <span>{isExportingDocx ? 'Generating...' : 'Download .DOCX'}</span>\n            </button>\n\n            <button\n              type=\"button\"\n              onClick={handleDownloadClassicDoc}\n              className=\"inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-xs shadow-xs transition-all cursor-pointer\"\n              title=\"Download Classic Microsoft Word (.doc) file\"\n            >\n              <Download className=\"w-4 h-4\" />\n              <span className=\"hidden sm:inline\">Word .DOC</span>\n            </button>\n\n            <button\n              type=\"button\"\n              onClick={handlePrintA4}\n              className=\"inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-white font-semibold text-xs shadow-xs transition-all cursor-pointer\"\n              title=\"Print all 8 A4 sheets or Save as PDF\"\n            >\n              <Printer className=\"w-4 h-4\" />\n              <span className=\"hidden sm:inline\">Print / A4 PDF</span>\n            </button>\n          </div>\n        </div>\n\n        {/* Mobile View Switcher */}\n        <div className=\"flex lg:hidden items-center justify-center gap-2 mt-2 pt-2 border-t border-zinc-100\">\n          {[\n            { id: 'split', label: 'Split View' },\n            { id: 'form', label: 'Fill Details Form' },\n            { id: 'preview', label: '8-Page A4 Preview' },\n          ].map((m) => (\n            <button\n              key={m.id}\n              type=\"button\"\n              onClick={() => setMobileView(m.id as 'split' | 'form' | 'preview')}\n              className={`px-3 py-1 rounded-lg text-xs font-semibold ${\n                mobileView === m.id\n                  ? 'bg-[#1E3A8A] text-white'\n                  : 'bg-zinc-100 text-zinc-600'\n              }`}\n            >\n              {m.label}\n            </button>\n          ))}\n        </div>\n      </header>\n\n      {/* ==================== MAIN WORKSPACE SPLIT VIEW ==================== */}\n      <div className=\"flex-1 flex flex-col lg:flex-row lg:overflow-hidden print-container\">\n        {/* LEFT SIDEBAR: FORM & AUTO-CALCULATOR */}\n        <aside\n          className={`no-print w-full lg:w-[440px] xl:w-[470px] shrink-0 lg:h-full lg:overflow-hidden ${\n            mobileView === 'preview' ? 'hidden lg:block' : 'block'\n          }`}\n        >\n          <DeedFormSidebar\n            data={deedData}\n            metrics={metrics}\n            activeTab={activeTab}\n            setActiveTab={setActiveTab}\n            onChange={handleFieldChange}\n            onBatchUpdate={handleBatchUpdate}\n            onResetDefaults={handleResetDefaults}\n            onScrollToPage={handleScrollToPage}\n          />\n        </aside>\n\n        {/* RIGHT WORKSPACE: 8 A4 PAGES LIVE DOCUMENT PREVIEW */}\n        <main\n          ref={previewScrollContainerRef}\n          className={`flex-1 flex flex-col bg-[#E4E2DD] lg:h-full lg:overflow-y-auto print-container ${\n            mobileView === 'form' ? 'hidden lg:flex' : 'flex'\n          }`}\n        >\n          {/* Floating Page Jump & Zoom Toolbar */}\n          <div className=\"no-print sticky top-0 z-20 bg-[#E4E2DD]/95 backdrop-blur-xs border-b border-zinc-300/80 px-4 py-2 flex flex-wrap items-center justify-between gap-2\">\n            {/* Page Filter / Jump Pills */}\n            <div className=\"flex items-center gap-1 flex-wrap\">\n              <span className=\"text-[11px] font-bold uppercase tracking-wider text-zinc-500 mr-1 flex items-center gap-1\">\n                <FileText className=\"w-3.5 h-3.5\" />\n                A4 Pages:\n              </span>\n              <button\n                type=\"button\"\n                onClick={() => setSelectedPageFilter('all')}\n                className={`px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer transition-all ${\n                  selectedPageFilter === 'all'\n                    ? 'bg-[#1E3A8A] text-white shadow-2xs'\n                    : 'bg-white text-zinc-700 hover:bg-zinc-100 border border-zinc-300'\n                }`}\n              >\n                All 8 Pages\n              </button>\n              {[1, 2, 3, 4, 5, 6, 7, 8].map((pageNum) => (\n                <button\n                  key={pageNum}\n                  type=\"button\"\n                  onClick={() => {\n                    if (selectedPageFilter === 'all') {\n                      handleScrollToPage(pageNum);\n                    } else {\n                      setSelectedPageFilter(pageNum);\n                    }\n                  }}\n                  onDoubleClick={() => setSelectedPageFilter(pageNum)}\n                  className={`px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer transition-all ${\n                    selectedPageFilter === pageNum\n                      ? 'bg-[#1E3A8A] text-white shadow-2xs'\n                      : 'bg-white text-zinc-700 hover:bg-zinc-100 border border-zinc-300'\n                  }`}\n                  title={`Click to jump to Page ${pageNum}`}\n                >\n                  Pg {pageNum}\n                </button>\n              ))}\n            </div>\n\n            {/* Highlight Toggle & Zoom Controls */}\n            <div className=\"flex items-center gap-2\">\n              <button\n                type=\"button\"\n                onClick={() => setShowHighlights((prev) => !prev)}\n                className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold border cursor-pointer transition-all ${\n                  showHighlights\n                    ? 'bg-amber-100 text-amber-900 border-amber-300'\n                    : 'bg-white text-zinc-600 border-zinc-300'\n                }`}\n                title=\"Toggle highlight markers on dynamic fields (never shown when printing)\"\n              >\n                {showHighlights ? (\n                  <Highlighter className=\"w-3.5 h-3.5 text-amber-700\" />\n                ) : (\n                  <Eye className=\"w-3.5 h-3.5\" />\n                )}\n                <span>{showHighlights ? 'Highlights: ON' : 'Clean Paper View'}</span>\n              </button>\n\n              <div className=\"hidden sm:flex items-center bg-white rounded-lg border border-zinc-300 px-1 py-0.5\">\n                <button\n                  type=\"button\"\n                  onClick={() => setZoom((z) => Math.max(0.6, Number((z - 0.1).toFixed(2))))}\n                  className=\"p-1 text-zinc-600 hover:text-zinc-900 cursor-pointer\"\n                  title=\"Zoom Out\"\n                >\n                  <ZoomOut className=\"w-3.5 h-3.5\" />\n                </button>\n                <span className=\"px-2 text-[11px] font-mono-num font-semibold text-zinc-700\">\n                  {Math.round(zoom * 100)}%\n                </span>\n                <button\n                  type=\"button\"\n                  onClick={() => setZoom((z) => Math.min(1.15, Number((z + 0.1).toFixed(2))))}\n                  className=\"p-1 text-zinc-600 hover:text-zinc-900 cursor-pointer\"\n                  title=\"Zoom In\"\n                >\n                  <ZoomIn className=\"w-3.5 h-3.5\" />\n                </button>\n              </div>\n            </div>\n          </div>\n\n          {/* A4 Paper Stack Container */}\n          <div className=\"flex-1 py-6 px-2 sm:px-6 overflow-x-auto print-container\">\n            <div\n              className=\"print-scale-reset origin-top transition-transform duration-150 mx-auto\"\n              style={{\n                transform: `scale(${zoom})`,\n                transformOrigin: 'top center',\n                marginBottom: zoom < 1 ? `-${(1 - zoom) * 1600}px` : '0px',\n              }}\n            >\n              <A4DocumentPreview\n                data={deedData}\n                metrics={metrics}\n                activeTab={activeTab}\n                selectedPageFilter={selectedPageFilter}\n                showHighlights={showHighlights}\n                onSelectSection={handleSelectSectionFromPreview}\n                pageRefs={pageRefs}\n              />\n            </div>\n          </div>\n        </main>\n      </div>\n    </div>\n  );\n}\n\nexport default App;\n","src/components/DeedFormSidebar.tsx":"import React from 'react';\nimport {\n  Building2,\n  Calculator,\n  CheckCircle2,\n  Sparkles,\n  Users,\n  UserCheck,\n  ArrowRight,\n  RotateCcw,\n} from 'lucide-react';\nimport {\n  CalculatedDeedMetrics,\n  DELHI_CATEGORY_RATES,\n  DutyGenderLabel,\n  HonorificType,\n  RelationType,\n  SaleAmountMode,\n  SaleDeedData,\n  ShortRelationType,\n} from '../types/deed';\nimport { formatIndianNumber, formatSqMtr } from '../utils/calculations';\n\ninterface DeedFormSidebarProps {\n  data: SaleDeedData;\n  metrics: CalculatedDeedMetrics;\n  activeTab: number;\n  setActiveTab: (tab: number) => void;\n  onChange: <K extends keyof SaleDeedData>(key: K, value: SaleDeedData[K]) => void;\n  onBatchUpdate: (updates: Partial<SaleDeedData>) => void;\n  onResetDefaults: () => void;\n  onScrollToPage: (pageNumber: number) => void;\n}\n\nconst HONORIFICS: HonorificType[] = ['SHRI', 'SMT.', 'KUMARI', 'MR.', 'MS.', 'M/S'];\nconst RELATIONS: RelationType[] = ['SON OF', 'DAUGHTER OF', 'WIFE OF', 'CARE OF'];\nconst SHORT_RELATIONS: { label: string; value: ShortRelationType }[] = [\n  { label: 'S/O (Son of)', value: 'S/O' },\n  { label: 'D/O (Daughter of)', value: 'D/O' },\n  { label: 'W/O (Wife of)', value: 'W/O' },\n  { label: 'C/O (Care of)', value: 'C/O' },\n];\n\nconst FLOOR_PRESETS = [\n  '(ENTIRE THIRD FLOOR WITH ROOF RIGHTS)',\n  '(ENTIRE GROUND FLOOR WITHOUT ROOF RIGHTS)',\n  '(ENTIRE FIRST FLOOR WITHOUT ROOF RIGHTS)',\n  '(ENTIRE SECOND FLOOR WITHOUT ROOF RIGHTS)',\n  '(ENTIRE UPPER GROUND FLOOR WITHOUT ROOF RIGHTS)',\n  '(ENTIRE BUILT-UP PROPERTY WITH ROOF RIGHTS)',\n];\n\nfunction formatAadharInput(raw: string): string {\n  const digits = raw.replace(/\\D/g, '').slice(0, 12);\n  const parts: string[] = [];\n  for (let i = 0; i < digits.length; i += 4) {\n    parts.push(digits.slice(i, i + 4));\n  }\n  return parts.length > 0 ? parts.join('-') : raw;\n}\n\nexport const DeedFormSidebar: React.FC<DeedFormSidebarProps> = ({\n  data,\n  metrics,\n  activeTab,\n  setActiveTab,\n  onChange,\n  onBatchUpdate,\n  onResetDefaults,\n  onScrollToPage,\n}) => {\n  const tabs = [\n    {\n      id: 1,\n      title: '1. Valuation',\n      subtitle: 'Page 1 & 4 Calc',\n      icon: Calculator,\n      targetPage: 1,\n    },\n    {\n      id: 2,\n      title: '2. Buyer & Seller',\n      subtitle: 'Page 2 Parties',\n      icon: Users,\n      targetPage: 2,\n    },\n    {\n      id: 3,\n      title: '3. Property & Floor',\n      subtitle: 'Page 2 & 3 Address',\n      icon: Building2,\n      targetPage: 2,\n    },\n    {\n      id: 4,\n      title: '4. Witnesses',\n      subtitle: 'Page 6 Details',\n      icon: UserCheck,\n      targetPage: 6,\n    },\n  ];\n\n  const handleSelectPlotSqYds = (sqYds: number, syncPage2 = true) => {\n    const updates: Partial<SaleDeedData> = {\n      plotAreaSqYds: sqYds,\n    };\n    if (syncPage2 || data.syncPropertySqYdsWithPage1) {\n      updates.propertySqYdsPage2 = sqYds;\n    }\n    onBatchUpdate(updates);\n    onScrollToPage(1);\n  };\n\n  const handleCategoryChange = (cat: string) => {\n    const preset = DELHI_CATEGORY_RATES[cat];\n    if (preset) {\n      onBatchUpdate({\n        category: cat,\n        govLandRatePerSqMtr: preset.landRate,\n        govConstRatePerSqMtr: preset.constRate,\n      });\n    } else {\n      onChange('category', cat);\n    }\n  };\n\n  const handleDutyGenderPreset = (gender: DutyGenderLabel) => {\n    if (gender === 'For Male') {\n      onBatchUpdate({\n        dutyGenderLabel: 'For Male',\n        corpDutyPercent: 3,\n        stampDutyPercent: 3,\n      });\n    } else if (gender === 'For Female') {\n      onBatchUpdate({\n        dutyGenderLabel: 'For Female',\n        corpDutyPercent: 2,\n        stampDutyPercent: 2,\n      });\n    } else {\n      onBatchUpdate({\n        dutyGenderLabel: 'For Joint (Male & Female)',\n        corpDutyPercent: 2.5,\n        stampDutyPercent: 2.5,\n      });\n    }\n  };\n\n  return (\n    <div className=\"flex flex-col h-full bg-white border-r border-zinc-200 select-none\">\n      {/* Step Navigation Tabs */}\n      <div className=\"grid grid-cols-4 border-b border-zinc-200 bg-zinc-50/80 p-1.5 gap-1\">\n        {tabs.map((tab) => {\n          const Icon = tab.icon;\n          const isActive = activeTab === tab.id;\n          return (\n            <button\n              key={tab.id}\n              type=\"button\"\n              onClick={() => {\n                setActiveTab(tab.id);\n                onScrollToPage(tab.targetPage);\n              }}\n              className={`flex flex-col items-center justify-center py-2 px-1.5 rounded-lg text-center transition-all cursor-pointer ${\n                isActive\n                  ? 'bg-[#1E3A8A] text-white shadow-xs'\n                  : 'text-zinc-600 hover:bg-zinc-200/60 hover:text-zinc-900'\n              }`}\n            >\n              <Icon className=\"w-4 h-4 mb-1\" />\n              <span className=\"text-[11px] font-semibold leading-tight\">\n                {tab.title}\n              </span>\n              <span\n                className={`text-[9.5px] leading-tight mt-0.5 ${\n                  isActive ? 'text-blue-100' : 'text-zinc-400'\n                }`}\n              >\n                {tab.subtitle}\n              </span>\n            </button>\n          );\n        })}\n      </div>\n\n      {/* Scrollable Form Content */}\n      <div className=\"flex-1 overflow-y-auto p-4 space-y-5\">\n        {/* ==================== TAB 1: PAGE 1 AUTO CALCULATOR ==================== */}\n        {activeTab === 1 && (\n          <div className=\"space-y-4\">\n            {/* Highlight Banner for 40 yds -> 50 yds automatic calculation */}\n            <div className=\"rounded-xl bg-gradient-to-br from-blue-50 via-indigo-50/60 to-amber-50/40 border border-blue-200 p-3.5\">\n              <div className=\"flex items-center justify-between mb-2\">\n                <span className=\"inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-[#1E3A8A]\">\n                  <Sparkles className=\"w-3.5 h-3.5 text-amber-600\" />\n                  Page 1 Automatic Yard Calculator\n                </span>\n                <button\n                  type=\"button\"\n                  onClick={onResetDefaults}\n                  className=\"inline-flex items-center gap-1 text-[11px] font-medium text-zinc-600 hover:text-zinc-900 cursor-pointer\"\n                  title=\"Reset to Reference Image Defaults\"\n                >\n                  <RotateCcw className=\"w-3 h-3\" />\n                  Reset 40 Yds\n                </button>\n              </div>\n              <p className=\"text-xs text-zinc-600 mb-3 leading-relaxed\">\n                Change Plot Area (e.g. <strong>40 sq.yds to 50 sq.yds</strong>) and\n                Page 1 &amp; Page 4 automatically calculate Sq.Mtr, Plinth Area, Land\n                Value, Construction Value, Total Value &amp; Stamp Duty.\n              </p>\n\n              {/* Quick Yardage Switcher Pills */}\n              <div className=\"flex flex-wrap gap-1.5 mb-3\">\n                {[\n                  { label: '40 Sq.Yds (Ref)', value: 40 },\n                  { label: '50 Sq.Yds', value: 50 },\n                  { label: '52 Sq.Yds', value: 52 },\n                  { label: '60 Sq.Yds', value: 60 },\n                  { label: '75 Sq.Yds', value: 75 },\n                  { label: '100 Sq.Yds', value: 100 },\n                ].map((preset) => (\n                  <button\n                    key={preset.value}\n                    type=\"button\"\n                    onClick={() => handleSelectPlotSqYds(preset.value, preset.value !== 40)}\n                    className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer border ${\n                      Number(data.plotAreaSqYds) === preset.value\n                        ? 'bg-[#1E3A8A] text-white border-[#1E3A8A] shadow-xs'\n                        : 'bg-white text-zinc-700 border-zinc-300 hover:border-blue-500 hover:text-blue-900'\n                    }`}\n                  >\n                    {preset.label}\n                  </button>\n                ))}\n              </div>\n\n              {/* Main Plot Area Input & Live Sq.Mtr Readout */}\n              <div className=\"grid grid-cols-2 gap-3 bg-white/90 p-2.5 rounded-lg border border-blue-200/80\">\n                <div>\n                  <label className=\"block text-[11px] font-semibold text-zinc-700 mb-1\">\n                    Plot Area (in Sq. Yards)\n                  </label>\n                  <div className=\"relative\">\n                    <input\n                      type=\"number\"\n                      step=\"any\"\n                      min=\"1\"\n                      value={data.plotAreaSqYds}\n                      onChange={(e) => {\n                        const val = parseFloat(e.target.value) || 0;\n                        onChange('plotAreaSqYds', val);\n                      }}\n                      className=\"w-full h-9 px-3 pr-14 rounded-md border border-blue-400 bg-white text-sm font-bold text-zinc-900 font-mono-num focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]\"\n                    />\n                    <span className=\"absolute right-2.5 top-2 text-xs font-medium text-zinc-400\">\n                      sq.yds\n                    </span>\n                  </div>\n                </div>\n                <div>\n                  <label className=\"block text-[11px] font-semibold text-zinc-700 mb-1\">\n                    Auto Area in Sq. Mtr.\n                  </label>\n                  <div className=\"h-9 px-3 rounded-md bg-emerald-50 border border-emerald-200 flex items-center justify-between\">\n                    <span className=\"text-sm font-bold text-emerald-800 font-mono-num\">\n                      {formatSqMtr(metrics.plotAreaSqMtr)}\n                    </span>\n                    <span className=\"text-[11px] font-medium text-emerald-600\">\n                      Sq. Mtr.\n                    </span>\n                  </div>\n                </div>\n              </div>\n            </div>\n\n            {/* Colony & Category Section */}\n            <div className=\"space-y-3 bg-zinc-50/70 p-3.5 rounded-xl border border-zinc-200\">\n              <h3 className=\"text-xs font-bold uppercase tracking-wider text-zinc-700\">\n                Colony, Category &amp; Plinth Multipliers\n              </h3>\n\n              <div className=\"grid grid-cols-3 gap-2.5\">\n                <div className=\"col-span-2\">\n                  <label className=\"block text-xs font-medium text-zinc-700 mb-1\">\n                    Name of Colony / Area (Page 1)\n                  </label>\n                  <input\n                    type=\"text\"\n                    value={data.colonyAreaPage1}\n                    onChange={(e) => onChange('colonyAreaPage1', e.target.value)}\n                    className=\"w-full h-9 px-3 rounded-md border border-zinc-300 bg-white text-xs font-semibold uppercase focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]\"\n                    placeholder=\"DASHRATH PURI\"\n                  />\n                </div>\n                <div>\n                  <label className=\"block text-xs font-medium text-zinc-700 mb-1\">\n                    Category\n                  </label>\n                  <select\n                    value={data.category}\n                    onChange={(e) => handleCategoryChange(e.target.value)}\n                    className=\"w-full h-9 px-2.5 rounded-md border border-zinc-300 bg-white text-xs font-bold focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]\"\n                  >\n                    {['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'].map((cat) => (\n                      <option key={cat} value={cat}>\n                        Category “{cat}”\n                      </option>\n                    ))}\n                  </select>\n                </div>\n              </div>\n\n              <div className=\"grid grid-cols-2 gap-2.5\">\n                <div>\n                  <label className=\"block text-xs font-medium text-zinc-700 mb-1\">\n                    Land Use\n                  </label>\n                  <input\n                    type=\"text\"\n                    value={data.landUse}\n                    onChange={(e) => onChange('landUse', e.target.value)}\n                    className=\"w-full h-9 px-3 rounded-md border border-zinc-300 bg-white text-xs font-medium focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]\"\n                  />\n                </div>\n                <div>\n                  <label className=\"block text-xs font-medium text-zinc-700 mb-1\">\n                    Construction Multiplier (X{data.constructionMultiplier}X)\n                  </label>\n                  <input\n                    type=\"number\"\n                    min=\"1\"\n                    max=\"10\"\n                    step=\"1\"\n                    value={data.constructionMultiplier}\n                    onChange={(e) => {\n                      const val = parseFloat(e.target.value) || 1;\n                      onBatchUpdate({\n                        constructionMultiplier: val,\n                        totalFloorsMultiplier: val,\n                      });\n                    }}\n                    className=\"w-full h-9 px-3 rounded-md border border-zinc-300 bg-white text-xs font-mono-num font-semibold focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]\"\n                  />\n                </div>\n              </div>\n\n              {/* Government Rates */}\n              <div className=\"grid grid-cols-2 gap-2.5\">\n                <div>\n                  <label className=\"block text-[11px] font-medium text-zinc-700 mb-1\">\n                    Govt. Land Rate (Rs./Sq.Mtr)\n                  </label>\n                  <input\n                    type=\"number\"\n                    value={data.govLandRatePerSqMtr}\n                    onChange={(e) =>\n                      onChange('govLandRatePerSqMtr', parseFloat(e.target.value) || 0)\n                    }\n                    className=\"w-full h-9 px-3 rounded-md border border-zinc-300 bg-white text-xs font-mono-num font-semibold focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]\"\n                  />\n                </div>\n                <div>\n                  <label className=\"block text-[11px] font-medium text-zinc-700 mb-1\">\n                    Govt. Const. Rate (Rs./Sq.Mtr)\n                  </label>\n                  <input\n                    type=\"number\"\n                    value={data.govConstRatePerSqMtr}\n                    onChange={(e) =>\n                      onChange('govConstRatePerSqMtr', parseFloat(e.target.value) || 0)\n                    }\n                    className=\"w-full h-9 px-3 rounded-md border border-zinc-300 bg-white text-xs font-mono-num font-semibold focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]\"\n                  />\n                </div>\n              </div>\n            </div>\n\n            {/* Live Computed Valuation Breakdown Card */}\n            <div className=\"rounded-xl bg-zinc-900 text-white p-3.5 space-y-2 shadow-sm\">\n              <div className=\"flex items-center justify-between text-xs text-zinc-400 border-b border-zinc-800 pb-1.5\">\n                <span>Auto-Calculated Valuation Summary</span>\n                <span className=\"font-mono-num text-amber-400\">\n                  {data.plotAreaSqYds} sq.yds = {formatSqMtr(metrics.plotAreaSqMtr)}{' '}\n                  Sq.Mtr\n                </span>\n              </div>\n              <div className=\"flex justify-between text-xs\">\n                <span className=\"text-zinc-300\">\n                  Total Plinth Area (×{data.totalFloorsMultiplier}):\n                </span>\n                <span className=\"font-mono-num font-semibold\">\n                  {formatSqMtr(metrics.totalPlinthAreaSqMtr)} Sq.Mtrs.\n                </span>\n              </div>\n              <div className=\"flex justify-between text-xs\">\n                <span className=\"text-zinc-300\">Minimum Value of Land:</span>\n                <span className=\"font-mono-num font-semibold text-emerald-300\">\n                  Rs.{formatIndianNumber(metrics.minLandValue)}/-\n                </span>\n              </div>\n              <div className=\"flex justify-between text-xs\">\n                <span className=\"text-zinc-300\">Minimum Value of Construction:</span>\n                <span className=\"font-mono-num font-semibold text-emerald-300\">\n                  Rs.{formatIndianNumber(metrics.minConstructionValue)}/-\n                </span>\n              </div>\n              <div className=\"flex justify-between text-xs pt-1.5 border-t border-zinc-800\">\n                <span className=\"font-semibold text-white\">\n                  Total Value of Property:\n                </span>\n                <span className=\"font-mono-num font-bold text-amber-300 text-sm\">\n                  Rs.{formatIndianNumber(metrics.totalPropertyValue)}/-\n                </span>\n              </div>\n            </div>\n\n            {/* Sale Consideration & Stamp Duty Paid On */}\n            <div className=\"space-y-3 bg-zinc-50/70 p-3.5 rounded-xl border border-zinc-200\">\n              <h3 className=\"text-xs font-bold uppercase tracking-wider text-zinc-700\">\n                Sale Deed Amount &amp; Stamp Duty Calculation\n              </h3>\n\n              <div>\n                <label className=\"block text-xs font-medium text-zinc-700 mb-1.5\">\n                  How to set &quot;Total stamp duty paid on&quot; / Sale Deed Amount:\n                </label>\n                <div className=\"grid grid-cols-3 gap-1.5\">\n                  {[\n                    {\n                      id: 'round_lakh' as SaleAmountMode,\n                      label: 'Auto Next Lakh',\n                      desc: '24.75L → 25L',\n                    },\n                    {\n                      id: 'exact_valuation' as SaleAmountMode,\n                      label: 'Exact Value',\n                      desc: `Rs.${formatIndianNumber(metrics.totalPropertyValue)}`,\n                    },\n                    {\n                      id: 'custom' as SaleAmountMode,\n                      label: 'Custom Amount',\n                      desc: 'Enter manually',\n                    },\n                  ].map((mode) => (\n                    <button\n                      key={mode.id}\n                      type=\"button\"\n                      onClick={() => onChange('saleAmountMode', mode.id)}\n                      className={`p-2 rounded-lg border text-left transition-all cursor-pointer ${\n                        data.saleAmountMode === mode.id\n                          ? 'bg-blue-50 border-[#1E3A8A] text-[#1E3A8A]'\n                          : 'bg-white border-zinc-200 text-zinc-600 hover:border-zinc-300'\n                      }`}\n                    >\n                      <div className=\"text-[11px] font-bold\">{mode.label}</div>\n                      <div className=\"text-[10px] opacity-80 truncate\">{mode.desc}</div>\n                    </button>\n                  ))}\n                </div>\n              </div>\n\n              {data.saleAmountMode === 'custom' && (\n                <div>\n                  <label className=\"block text-xs font-medium text-zinc-700 mb-1\">\n                    Custom Sale Consideration / Stamp Duty Paid On (Rs.)\n                  </label>\n                  <input\n                    type=\"number\"\n                    step=\"1000\"\n                    value={data.customSaleAmount}\n                    onChange={(e) =>\n                      onChange('customSaleAmount', parseFloat(e.target.value) || 0)\n                    }\n                    className=\"w-full h-9 px-3 rounded-md border border-blue-400 bg-white text-sm font-mono-num font-bold focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]\"\n                  />\n                </div>\n              )}\n\n              <div className=\"p-2.5 rounded-lg bg-amber-50/90 border border-amber-200 text-xs\">\n                <div className=\"flex justify-between font-bold text-amber-950\">\n                  <span>Sale Deed &amp; Stamp Duty Amount:</span>\n                  <span className=\"font-mono-num\">\n                    Rs. {formatIndianNumber(metrics.stampDutyPaidOnAmount)}/-\n                  </span>\n                </div>\n                <div className=\"text-[11px] text-amber-800 mt-0.5 italic\">\n                  Page 4 Words: &quot;{metrics.stampDutyAmountInWords}&quot;\n                </div>\n              </div>\n\n              {/* Duty Gender & Percentages */}\n              <div>\n                <label className=\"block text-xs font-medium text-zinc-700 mb-1.5\">\n                  Stamp Duty Category (Bottom of Page 1)\n                </label>\n                <div className=\"grid grid-cols-3 gap-1.5 mb-2.5\">\n                  {(\n                    [\n                      'For Male',\n                      'For Female',\n                      'For Joint (Male & Female)',\n                    ] as DutyGenderLabel[]\n                  ).map((label) => (\n                    <button\n                      key={label}\n                      type=\"button\"\n                      onClick={() => handleDutyGenderPreset(label)}\n                      className={`py-1.5 px-2 rounded-md text-[11px] font-semibold border cursor-pointer ${\n                        data.dutyGenderLabel === label\n                          ? 'bg-[#1E3A8A] text-white border-[#1E3A8A]'\n                          : 'bg-white text-zinc-700 border-zinc-300 hover:bg-zinc-100'\n                      }`}\n                    >\n                      {label === 'For Joint (Male & Female)' ? 'For Joint' : label}\n                    </button>\n                  ))}\n                </div>\n\n                <div className=\"grid grid-cols-2 gap-2.5\">\n                  <div>\n                    <label className=\"block text-[11px] font-medium text-zinc-600 mb-1\">\n                      Corporation Duty (%)\n                    </label>\n                    <input\n                      type=\"number\"\n                      step=\"0.5\"\n                      value={data.corpDutyPercent}\n                      onChange={(e) =>\n                        onChange('corpDutyPercent', parseFloat(e.target.value) || 0)\n                      }\n                      className=\"w-full h-8 px-2.5 rounded-md border border-zinc-300 bg-white text-xs font-mono-num font-semibold\"\n                    />\n                  </div>\n                  <div>\n                    <label className=\"block text-[11px] font-medium text-zinc-600 mb-1\">\n                      Stamp Duty (%)\n                    </label>\n                    <input\n                      type=\"number\"\n                      step=\"0.5\"\n                      value={data.stampDutyPercent}\n                      onChange={(e) =>\n                        onChange('stampDutyPercent', parseFloat(e.target.value) || 0)\n                      }\n                      className=\"w-full h-8 px-2.5 rounded-md border border-zinc-300 bg-white text-xs font-mono-num font-semibold\"\n                    />\n                  </div>\n                </div>\n\n                <div className=\"mt-2.5 pt-2 border-t border-zinc-200 flex justify-between items-center text-xs font-semibold text-zinc-800\">\n                  <span>\n                    Total Duty ({metrics.totalDutyPercent}% = Rs.\n                    {formatIndianNumber(metrics.corpDutyAmount)} + Rs.\n                    {formatIndianNumber(metrics.stampDutyAmount)}):\n                  </span>\n                  <span className=\"font-mono-num text-emerald-700 font-bold\">\n                    Rs.{formatIndianNumber(metrics.totalDutyAmount)}/-\n                  </span>\n                </div>\n              </div>\n            </div>\n\n            <button\n              type=\"button\"\n              onClick={() => {\n                setActiveTab(2);\n                onScrollToPage(2);\n              }}\n              className=\"w-full py-2.5 px-4 rounded-xl bg-[#1E3A8A] hover:bg-blue-900 text-white font-semibold text-xs flex items-center justify-center gap-2 shadow-xs cursor-pointer transition-colors\"\n            >\n              Next: Fill Buyer &amp; Seller Details (Page 2)\n              <ArrowRight className=\"w-4 h-4\" />\n            </button>\n          </div>\n        )}\n\n        {/* ==================== TAB 2: SELLER & BUYER DETAILS (PAGE 2) ==================== */}\n        {activeTab === 2 && (\n          <div className=\"space-y-4\">\n            {/* Execution Place & Date */}\n            <div className=\"bg-zinc-50/80 p-3.5 rounded-xl border border-zinc-200 space-y-2.5\">\n              <h3 className=\"text-xs font-bold uppercase tracking-wider text-zinc-700\">\n                Execution Place &amp; Date (Page 2 Top)\n              </h3>\n              <div className=\"grid grid-cols-2 gap-2.5\">\n                <div>\n                  <label className=\"block text-[11px] font-medium text-zinc-600 mb-1\">\n                    Place of Execution\n                  </label>\n                  <input\n                    type=\"text\"\n                    value={data.executionPlace}\n                    onChange={(e) => onChange('executionPlace', e.target.value)}\n                    className=\"w-full h-8 px-2.5 rounded-md border border-zinc-300 bg-white text-xs font-medium\"\n                  />\n                </div>\n                <div>\n                  <label className=\"block text-[11px] font-medium text-zinc-600 mb-1\">\n                    Execution Date (or --------)\n                  </label>\n                  <input\n                    type=\"text\"\n                    value={data.executionDateText}\n                    onChange={(e) => onChange('executionDateText', e.target.value)}\n                    placeholder=\"-------- or 15/05/2025 \"\n                    className=\"w-full h-8 px-2.5 rounded-md border border-zinc-300 bg-white text-xs font-medium\"\n                  />\n                </div>\n              </div>\n            </div>\n\n            {/* VENDOR / SELLER CARD */}\n            <div className=\"bg-blue-50/40 p-3.5 rounded-xl border border-blue-200 space-y-3\">\n              <div className=\"flex items-center justify-between\">\n                <span className=\"text-xs font-bold uppercase tracking-wider text-[#1E3A v className=\"col-span-2\">\n                  <label className=\"block text-[11px] font-medium text-zinc-700 mb-1\">\n                    Witness 2 Full Name\n                  </label>\n                  <input\n                    type=\"text\"\n                    value={data.witness2Name}\n                    onChange={(e) =>\n                      onChange('witness2Name', e.target.value.toUpperCase())\n                    }\n                    className=\"w-full h-9 px-3 rounded-md border border-zinc-300 bg-white text-xs font-bold uppercase\"\n                    placeholder=\"SATENDRA KUMAR SHARMA\"\n                  />\n                </div>\n              </div>\n\n              <div className=\"grid grid-cols-3 gap-2\">\n                <div>\n                  <label className=\"block text-[11px] font-medium text-zinc-700 mb-1\">\n                    Relation\n                  </label>\n                  <select\n                    value={data.witness2RelationType}\n                    onChange={(e) =>\n                      onChange(\n                        'witness2RelationType',\n                        e.target.value as ShortRelationType\n                      )\n                    }\n                    className=\"w-full h-9 px-2 rounded-md border border-zinc-300 bg-white text-xs font-bold\"\n                  >\n                    {SHORT_RELATIONS.map((r) => (\n                      <option key={r.value} value={r.value}>\n                        {r.label}\n                      </option>\n                    ))}\n                  </select>\n                </div>\n                <div className=\"col-span-2\">\n                  <label className=\"block text-[11px] font-medium text-zinc-700 mb-1\">\n                    Father / Husband Name\n                  </label>\n                  <input\n                    type=\"text\"\n                    value={data.witness2RelativeName}\n                    onChange={(e) =>\n                      onChange('witness2RelativeName', e.target.value.toUpperCase())\n                    }\n                    className=\"w-full h-9 px-3 rounded-md border border-zinc-300 bg-white text-xs font-bold uppercase\"\n                    placeholder=\"THAKUR PRASAD SHARMA\"\n                  />\n                </div>\n              </div>\n\n              <div className=\"space-y-1.5\">\n                <label className=\"block text-[11px] font-medium text-zinc-700\">\n                  Witness 2 Address Lines\n                </label>\n                <input\n                  type=\"text\"\n                  value={data.witness2AddressLine1}\n                  onChange={(e) =>\n                    onChange('witness2AddressLine1', e.target.value.toUpperCase())\n                  }\n                  placeholder=\"Address Line 1 (e.g. RZ-A-2/47,GALI NO-2A,DURGA PARK,NASIR)\"\n                  className=\"w-full h-8 px-2.5 rounded-md border border-zinc-300 bg-white text-xs font-medium uppercase\"\n                />\n                <input\n                  type=\"text\"\n                  value={data.witness2AddressLine2}\n                  onChange={(e) =>\n                    onChange('witness2AddressLine2', e.target.value.toUpperCase())\n                  }\n                  placeholder=\"Address Line 2 (e.g. PUR,SOUTH WEST DELHI-110045)\"\n                  className=\"w-full h-8 px-2.5 rounded-md border border-zinc-300 bg-white text-xs font-medium uppercase\"\n                />\n                <input\n                  type=\"text\"\n                  value={data.witness2AddressLine3}\n                  onChange={(e) =>\n                    onChange('witness2AddressLine3', e.target.value.toUpperCase())\n                  }\n                  placeholder=\"Address Line 3 (optional)\"\n                  className=\"w-full h-8 px-2.5 rounded-md border border-zinc-300 bg-white text-xs font-medium uppercase\"\n                />\n              </div>\n\n lectedPageFilter,\n  showHighlights,\n  onSelectSection,\n  pageRefs,\n}) => {\n  const sqMtrStr = formatSqMtr(metrics.plotAreaSqMtr);\n  const totalPlinthStr = formatSqMtr(metrics.totalPlinthAreaSqMtr);\n  const salePlinthStr = formatSqMtr(metrics.plinthAreaUnderSaleSqMtr);\n  const propDesc = buildFullPropertyDescription(data, metrics);\n\n  const shouldShowPage = (pageNum: number) =>\n    selectedPageFilter === 'all' || selectedPageFilter === pageNum;\n\n  const PageHeaderBadge: React.FC<{\n    pageNum: number;\n    title: string;\n    editTab: number;\n  }> = ({ pageNum, title, editTab }) => (\n    <div className=\"no-print flex items-center justify-between mb-2.5 px-1\">\n      <div className=\"flex items-center gap-2\">\n        <span className=\"inline-flex items-center justify-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-[#1E3A8A] text-white shadow-xs\">\n          A4 Sheet {pageNum} of 8\n        </span>\n        <span className=\"text-xs font-medium text-zinc-600\">{title}</span>\n      </div>\n      <button\n        type=\"button\"\n        onClick={() => onSelectSection(editTab)}\n        className=\"text-xs font-medium text-[#1E3A8A] hover:text-blue-900 underline cursor-pointer\"\n      >\n        Edit Page {pageNum} Fields →\n      </button>\n    </div>\n  );\n\n  return (\n    <div className={showHighlights ? 'show-highlights space-y-8' : 'space-y-8'} style={{ counterReset: 'deedPage 1 continuationPage 2' }}>\n      {/* ==================== PAGE 1 OF 6 ==================== */}\n      {shouldShowPage(1) && (\n        <div\n          ref={(el) => {\n            pageRefs.current[0] = el;\n          }}\n        >\n          <PageHeaderBadge\n            pageNum={1}\n            title=\"Valuation Table, Plot Sq.Yds to Sq.Mtr & Stamp Duty\"\n            editTab={1}\n          />\n          <div\n            className={`a4-page ${activeTab === 1 ? 'a4-page-active' : ''}`}\n            onClick={() => onSelectSection(1)}\n          >\n
