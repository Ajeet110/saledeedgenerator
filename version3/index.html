assName=\"live-field\">\n                      {sqMtrStr} X{data.constructionMultiplier}X Rs.\n                      {data.govConstRatePerSqMtr}/- = Rs.\n                      {formatIndianNumber(metrics.minConstructionValue)}/-\n                    </span>\n                  </td>\n                </tr>\n                <tr>\n                  <td>Total Value of Property</td>\n                  <td>\n                    :{' '}\n                    <span className=\"live-field font-semibold\">\n                      Rs.{formatIndianNumber(metrics.totalPropertyValue)}/-\n                    </span>\n                  </td>\n                </tr>\n                <tr>\n                  <td>Total stamp duty paid on</td>\n                  <td>\n                    :{' '}\n                    <span className=\"live-field font-semibold\">\n                      Rs.{formatIndianNumber(metrics.stampDutyPaidOnAmount)}/-\n                    </span>\n                  </td>\n                </tr>\n              </tbody>\n            </table>\n\n            {/* Bottom Right Duty Summary Block matching Reference Image 1 */}\n            <div className=\"mt-9 pr-2 flex flex-col items-end text-[10.5pt] leading-relaxed\">\n              <div className=\"pr-20 mb-0.5\">\n                <span className=\"live-field\">{data.dutyGenderLabel}</span>\n              </div>\n              <div className=\"mb-4\">\n                Corporation Duty..\n                <span className=\"live-field\">{data.corpDutyPercent}</span> %..@..Rs.\n                <span className=\"live-field\">\n                  {formatIndianNumber(metrics.corpDutyAmount)}\n                </span>\n                /-\n              </div>\n              <div className=\"mb-4\">\n                Stamp Duty..\n                <span className=\"live-field\">{data.stampDutyPercent}</span> %..@..Rs.\n                <span className=\"live-field\">\n                  {formatIndianNumber(metrics.stampDutyAmount)}\n                </span>\n                /-\n              </div>\n              <div>\n                Total Duty ..\n                <span className=\"live-field\">{metrics.totalDutyPercent}</span>%..@..Rs.\n                <span className=\"live-field font-semibold\">\n                  {formatIndianNumber(metrics.totalDutyAmount)}\n                </span>\n                /-\n              </div>\n            </div>\n          </div>\n        </div>\n      )}\n\n      {/* ==================== PAGE 2 OF 6 ==================== */}\n      {shouldShowPage(2) && (\n        <div\n          ref={(el) => {\n            pageRefs.current[1] = el;\n          }}\n        >\n          <PageHeaderBadge\n            pageNum={2}\n            title=\"Seller (Vendor), Buyer (Vendee), Property Address & Boundaries\"\n            editTab={2}\n          />\n          <div\n            className={`a4-page ${\n              activeTab === 2 || activeTab === 3 ? 'a4-page-active' : ''\n            }`}\n          >\n            {/* Execution Line */}\n            <p\n              className=\"mb-5 text-[10.5pt] leading-[1.6]\"\n              onClick={() => onSelectSection(2)}\n            >\n              This SALE DEED is made and executed at{' '}\n              <span className=\"live-field\">{data.executionPlace}</span> on this{' '}\n              <span className=\"live-field\">{data.executionDateText}</span>by and\n              between:-\n            </p>\n\n            {/* VENDOR (Seller) Block */}\n            <p\n              className=\"mb-5 text-justify text-[10.5pt] leading-[1.45] cursor-pointer\"\n              onClick={() => onSelectSection(2)}\n            >\n              <strong className=\"live-field font-bold\">\n                {data.vendorHonorific} {data.vendorName} {data.vendorRelationType}{' '}\n                {data.vendorRelativeHonorific} {data.vendorRelativeName} RESIDENT OF{' '}\n                {data.vendorAddress},\n              </strong>{' '}\n              Hereinafter referred to as &quot;the VENDOR&quot; (which expression,\n              herein used, shall mean and include {data.vendorPronoun} legal heirs,\n              successors, legal representatives, administrators, executors, nominees\n              and assignees) of the one part.\n            </p>\n\n            {/* IN FAVOUR OF */}\n            <p className=\"text-center font-bold italic underline mb-4 text-[10.5pt]\">\n              IN FAVOUR OF\n            </p>\n\n            {/* VENDEES (Buyer) Block */}\n            <p\n              className=\"mb-6 text-justify text-[10.5pt] leading-[1.85] cursor-pointer\"\n              onClick={() => onSelectSection(2)}\n            >\n              <strong className=\"live-field font-bold\">\n                {data.vendeeHonorific} {data.vendeeName} {data.vendeeRelationType}{' '}\n                {data.vendeeRelativeHonorific} {data.vendeeRelativeName} RESEDENT OF{' '}\n                {data.vendeeAddress},\n              </strong>{' '}\n              Hereinafter called &quot;The VENDEES&quot;, (which expression, herein\n              used, shall mean and include their heirs, successors, legal\n              representatives, administrators, executors, nominees and assignees of\n              the other part.\n            </p>\n\n            {/* WHEREAS Property Description Block */}\n            <p\n              className=\"mb-4 text-justify text-[10.5pt] leading-[1.9] cursor-pointer\"\n              onClick={() => onSelectSection(3)}\n            >\n              WHEREAS the VENDOR is the absolute and exclusive owner and in possession\n              of{' '}\n              <strong className=\"live-field font-bold\">{propDesc.mainBlock}</strong>\n            </p>\n\n            {/* City/Pin & Bounded as under */}\n            <p\n              className=\"mb-6 text-justify text-[10.5pt] leading-[1.7] cursor-pointer\"\n              onClick={() => onSelectSection(3)}\n            >\n              <strong className=\"live-field font-bold\">{propDesc.cityPin}</strong> and\n              the above mentioned property is bounded as under :-\n            </p>\n\n            {/* 4-Direction Boundaries Grid */}\n            <div\n              className=\"grid grid-cols-2 gap-y-6 gap-x-4 text-[10.5pt] mt-4 cursor-pointer\"\n              onClick={() => onSelectSection(3)}\n            >\n              <div className=\"flex items-start\">\n                <span className=\"w-24 shrink-0\">EAST</span>\n                <span>\n                  :- <span className=\"live-field\">{data.boundaryEast}</span>\n                </span>\n              </div>\n              <div className=\"flex items-start\">\n                <span className=\"w-16 shrink-0\">WEST</span>\n                <span>\n                  :- <span className=\"live-field\">{data.boundaryWest}</span>\n                </span>\n              </div>\n              <div className=\"flex items-start\">\n                <span className=\"w-24 shrink-0\">. NORTH</span>\n                <span>\n                  :- <span className=\"live-field\">{data.boundaryNorth}</span>\n                </span>\n              </div>\n              <div className=\"flex items-start\">\n                <span className=\"w-16 shrink-0\">SOUTH</span>\n                <span>\n                  :- <span className=\"live-field\">{data.boundarySouth}</span>\n                </span>\n              </div>\n            </div>\n          </div>\n        </div>\n      )}\n\n      {/* ==================== PAGE 3 OF 6 ==================== */}\n      {shouldShowPage(3) && (\n        <div\n          ref={(el) => {\n            pageRefs.current[2] = el;\n          }}\n        >\n          <PageHeaderBadge\n            pageNum={3}\n            title=\"Prior GPA/Title Chain & Agreement to Sell Property\"\n            editTab={3}\n          />\n          <div\n            className={`a4-page ${activeTab === 3 ? 'a4-page-active' : ''}`}\n            onClick={() => onSelectSection(3)}\n          >\n            {/* Paragraph 1: Prior Title / GPA */}\n            <p className=\"mb-7 text-justify text-[10.5pt] leading-[1.85]\">\n              (hereinafter referred to as the “<strong>Said Property</strong>”){' '}\n              <span className=\"live-field\">{data.priorTitleDocText}</span>, having\n              purchased from{' '}\n              <span className=\"live-field\">\n                {data.priorOwnerHonorific}\n                {data.priorOwnerName} {data.priorOwnerRelation}{' '}\n                {data.priorOwnerRelativeHonorific} {data.priorOwnerRelativeName}\n              </span>{' '}\n              to do all acts, deeds and things including the power to sell and transfer\n              the same in any manner.\n            </p>\n\n            {/* Paragraph 2 */}\n            <p className=\"mb-7 text-justify text-[10.5pt] leading-[1.85]\">\n              AND WHEREAS the VENDOR has full power and absolute authority to sell and\n              transfer the aforesaid property unto the VENDEES, and to receive the sale\n              consideration in {data.vendorPronoun} own name and neither anyone else has\n              any right, title and interest in the aforesaid property nor there is any\n              legal impediment which prohibits the VENDOR to sell the same unto the\n              VENDEES.\n            </p>\n\n            {/* Paragraph 3: Repeated Bold Property Address */}\n            <p className=\"mb-6 text-justify text-[10.5pt] leading-[1.85]\">\n              AND WHEREAS the VENDOR has agreed to sell, convey, transfer and assign{' '}\n              {data.vendorPronoun} all rights, titles and interests in the aforesaid{' '}\n              <strong className=\"live-field font-bold\">\n                {propDesc.combinedPage3}\n              </strong>\n            </p>\n\n            {/* Paragraph 4 */}\n            <p className=\"mb-7 text-justify text-[10.5pt] leading-[1.85]\">\n              hereinafter referred to as ”the said property”, alongwith all benefits,\n              facilities, privileges, easements or advantages belonging to or in any\n              way appertaining to the said property to the VENDEES.\n            </p>\n\n            {/* Paragraph 5 */}\n            <p className=\"text-justify text-[10.5pt] leading-[1.85]\">\n              AND WHEREAS the VENDEES has agreed to purchase, acquire and possess the\n              said property relying on the various assurances, covenants,\n              representations, statements and undertaking given by the VENDOR and\n              believing the same to be true and acting on the faith thereof and on the\n              terms and conditions mentioned hereunder.\n            </p>\n          </div>\n        </div>\n      )}\n\n      {/* ==================== PAGE 4 OF 6 ==================== */}\n      {shouldShowPage(4) && (\n        <div\n          ref={(el) => {\n            pageRefs.current[3] = el;\n          }}\n        >\n          <PageHeaderBadge\n            pageNum={4}\n            title=\"Sale Consideration in Figures & Words (Clauses 1 to 5)\"\n            editTab={1}\n          />\n          <div\n            className=\"a4-page\"\n            onClick={() => onSelectSection(1)}\n          >\n            <p className=\"font-bold underline mb-6 text-[10.5pt]\">\n              NOW THIS SALE DEED WITNESSESTH AS UNDER:-\n            </p>\n\n            <div className=\"space-y-7 text-[10.5pt] leading-[1.85]\">\n              {/* Clause 1 */}\n              <div className=\"flex items-start gap-3 text-justify pl-4\">\n                <span className=\"shrink-0\">1.</span>\n                <p>\n                  That in consideration of the said sum of{' '}\n                  <strong className=\"live-field font-bold\">\n                    Rs.{formatIndianNumber(metrics.stampDutyPaidOnAmount)}/- (\n                    {metrics.stampDutyAmountInWords}).\n                  </strong>\n                  , the VENDOR hereby sell, convey, alienate and transfer all{' '}\n                  {data.vendorPronoun} rights, titles and interests in the said\n                  property, along with boundary wall, fittings, fixtures and super\n                  structure thereon and all other estate rights whatsoever, including\n                  all easements, appurtenances to the said property as also enjoyed or\n                  reputed to be enjoyed therewith unto the VENDEES, in perfect and\n                  absolute ownership without any hindrance, disturbance, whatsoever, TO\n                  HAVE, TO HOLD AND TO ENJOY THE SAME ABSOLUTELY AND FOREVER.\n                </p>\n              </div>\n\n              {/* Clause 2: payment particulars */}\n              <div className=\"flex items-start gap-3 text-justify pl-4\">\n                <span className=\"shrink-0\">2.</span>\n                <div className=\"flex-1\">\n                  <p>That the said consideration has already been paid by the VENDEES to the VENDOR in the following manner:-</p>\n                  <table className=\"w-full border-collapse my-3 text-[9.5pt]\"><tbody><tr><td className=\"border border-black p-2\">Amount</td><td className=\"border border-black p-2\">Chq./D.D./P.O. No.</td><td className=\"border border-black p-2\">Dated</td><td className=\"border border-black p-2\">Name of Bank</td></tr><tr><td className=\"border border-black p-2\">&nbsp;</td><td className=\"border border-black p-2\">&nbsp;</td><td className=\"border border-black p-2\">&nbsp;</td><td className=\"border border-black p-2\">&nbsp;</td></tr></tbody></table>\n                  <p>as full and final payment/settlement towards the sale price of the said property, and the legal receipt of the same is hereby admitted and acknowledged by the VENDOR.</p>\n                </div>\n              </div>\n\n              {/* Clause 3 */}\n              <div className=\"flex items-start gap-3 text-justify pl-4\">\n                <span className=\"shrink-0\">3.</span>\n                <p>\n                  That the VENDOR hereby explicitly admits and declares that having\n                  received the aforesaid consideration in full and final payment, now\n                  nothing is left due from the VENDEES to the VENDOR against sale\n                  consideration for the purchase of the said property, as the aforesaid\n                  consideration represents the full and final consideration for the\n                  transaction.\n                </p>\n              </div>\n\n              {/* Clause 4 */}\n              <div className=\"flex items-start gap-3 text-justify pl-4\">\n                <span className=\"shrink-0\">4.</span>\n                <p>\n                  That the VENDOR has delivered the peaceful and actual physical vacant\n                  possession of the said property unto the VENDEES on the spot.\n                </p>\n              </div>\n\n              {/* Clause 5 */}\n              <div className=\"flex items-start gap-3 text-justify pl-4\">\n                <span className=\"shrink-0\">5.</span>\n                <p>\n                  That the VENDOR hereby sell, grant, convey, transfer and assign, with\n                  the ownership rights of the said property together with the super\n                  structure thereon, unto the VENDEES, and the VENDOR hereby transfers{' '}\n                  {data.vendorPronoun} all rights, titles and interests, along with all\n                  the rights, privileges, easements and appurtenances, whatsoever in the\n                  said property, belong and usually held herewith including all\n                  electric, water and all the estate right, title, and interest in the\n                  said property, hereby conveyed, and every part thereof TO HAVE AND TO\n                  HOLD THE SAME unto the VENDEES absolutely and forever.\n                </p>\n              </div>\n            </div>\n          </div>\n        </div>\n      )}\n\n      {/* ==================== PAGE 5 OF 6 ==================== */}\n      {shouldShowPage(5) && (\n        <div\n          ref={(el) => {\n            pageRefs.current[4] = el;\n          }}\n        >\n          <PageHeaderBadge\n            pageNum={5}\n            title=\"Indemnity, No Encumbrance & Mutation Rights (Clauses 6 to 9)\"\n            editTab={2}\n          />\n          <div className=\"a4-page\">\n            <div className=\"space-y-7 text-[10.5pt] leading-[1.85]\">\n              {/* Clause 5 */}\n              <div className=\"flex items-start gap-3 text-justify pl-4\">\n                <span className=\"shrink-0\">6.</span>\n                <p>\n                  That the VENDOR hereby assure the VENDEES that the said property,\n                  hereby conveyed, is free from all sorts of charges, encumbrances,\n                  liens, loan, claims, demands, and liabilities, surety, security,\n                  legal flaws, disputes, sale, mortgage, gift, liabilities,\n                  disabilities, injunction, notifications for acquisitions/requisition,\n                  and if ever it is proved to be otherwise and the VENDEES suffers, due\n                  to any legal defect in the title of the VENDOR, any loss and/or whole\n                  or any part of the said property, hereby conveyed, is taken away from\n                  the possession of the VENDEES, then the VENDOR will make good the\n                  losses thus suffered by the VENDEES in this regard and shall keep the\n                  VENDEES indemnified against all losses, costs, damages and expenses\n                  accruing thereby to the VENDEES.\n                </p>\n              </div>\n\n              {/* Clause 6 */}\n              <div className=\"flex items-start gap-3 text-justify pl-4\">\n                <span className=\"shrink-0\">7.</span>\n                <p>\n                  That the VENDOR hereby further assure the VENDEES that{' '}\n                  {data.vendorPronoun === 'his' ? 'he' : 'she'} or anyone else claiming\n                  from or through the VENDOR has not created any encumbrances or\n                  license or restriction thereon nor is there any claim or litigation or\n                  legal proceeding injunction or attachment concerning the said\n                  property.\n                </p>\n              </div>\n\n              {/* Clause 7 */}\n              <div className=\"flex items-start gap-3 text-justify pl-4\">\n                <span className=\"shrink-0\">8.</span>\n                <p>\n                  That the VENDOR now admits that{' '}\n                  {data.vendorPronoun === 'his' ? 'he' : 'she'} has been left with no\n                  right, title and interest of any nature, whatsoever may be in the said\n                  property, and the VENDEES has become the absolute owner of the same\n                  and {data.vendeePronoun === 'his' ? 'he' : 'she'} will use and enjoy\n                  the same in any manner, {data.vendeePronoun === 'his' ? 'he' : 'she'}{' '}\n                  likes, including right to sell, transfer or alienate the said property\n                  to anyone including the right to give the same on rent to anyone and\n                  to receive the rent and profit to the tenant(s) evicted through the\n                  process of law or by negotiation, to take possession etc.\n                </p>\n              </div>\n\n              {/* Clause 8 */}\n              <div className=\"flex items-start gap-3 text-justify pl-4\">\n                <span className=\"shrink-0\">9.</span>\n                <p>\n                  That the VENDEES can get the mutation of the said property in{' '}\n                  {data.vendeePronoun} own name in the absence of the VENDOR on the\n                  basis of this sale deed or its certified true copy in the revenue\n                  records.\n                </p>\n              </div>\n            </div>\n          </div>\n        </div>\n      )}\n\n      {/* ==================== PAGE 6 OF 8 ==================== */}\n      {shouldShowPage(6) && (\n        <div ref={(el) => { pageRefs.current[5] = el; }}>\n          <PageHeaderBadge pageNum={6} title=\"Clauses 10 to 15\" editTab={4} />\n          <div className=\"a4-page\"><div className=\"space-y-4 text-[10.2pt] leading-[1.55]\">\n            <div className=\"flex items-start gap-2 text-justify pl-4\"><span>10.</span><p>That the VENDOR or any other person/s claiming under or through the VENDOR shall, as and when required by the VENDEES, co-operate with the VENDEES at the VENDEES&apos; cost and do all acts and execute all documents required by the concerned authorities for more fully effectuating the sale hereby made or for more fully owning and enjoying the said property or defending any action or proceeding concerning the same.</p></div>\n            <div className=\"flex items-start gap-2 text-justify pl-4\"><span>11.</span><p>That the VENDOR will be responsible for payment of the rates, cesses and taxes payable in respect of the said property up to date, and thereafter the VENDEES will be responsible for payment of the same.</p></div>\n            <div className=\"flex items-start gap-2 text-justify pl-4\"><span>12.</span><p>That the VENDEES can apply for and get fresh electricity and water connections installed in the said property or can get the existing electricity and water connections, along with their security amount, transferred in their own name from the concerned authority by presenting this Sale Deed or its certified true copy, and this Sale Deed shall be deemed and construed to grant the No Objection Certificate by the VENDOR in favour of the VENDEES.</p></div>\n            <div className=\"flex items-start gap-2 text-justify pl-4\"><span>13.</span><p>That all the occupants of the said building shall bear proportionate expenses for maintenance and repair of common amenities and services of the said building.</p></div>\n            <div className=\"flex items-start gap-2 text-justify pl-4\"><span>14.</span><p>That the VENDEES shall have proportionate rights in the land of the property (according to their ownership) whenever the property/building collapses due to any calamity like earthquake, flood, fire, etc.</p></div>\n            <div className=\"flex items-start gap-2 text-justify pl-4\"><span>15.</span><p>That it has been agreed that the VENDEES or any other occupant/owner of the building will not obstruct the staircase or common passage, etc., by keeping a dustbin or any kind of item.</p></div>\n          </div></div>\n        </div>\n      )}\n\n      {/* ==================== PAGE 7 OF 8 ==================== */}\n      {shouldShowPage(7) && (\n        <div ref={(el) => { pageRefs.current[6] = el; }}>\n          <PageHeaderBadge pageNum={7} title=\"Clauses 16 to 20\" editTab={4} />\n          <div className=\"a4-page\">\n            <div className=\"space-y-7 text-[10.5pt] leading-[1.7]\">\n              <div className=\"flex items-start gap-2 text-justify pl-4\"><span>16.</span><p>That the VENDEES or any other occupant/owner of the building shall not be entitled to disturb or remove the basic and fundamental structure such as columns, beams and facing walls of the building.</p></div>\n              <div className=\"flex items-start gap-2 text-justify pl-4\"><span>17.</span><p>That the owners/occupants of upper ground, first and second floors can go on the roof of the top floor of the said property for installation, inspection or repair of their water tank and T.V./Dish Antenna at any reasonable hours.</p></div>\n              <div className=\"flex items-start gap-2 text-justify pl-4\"><span>18.</span><p>That any error or omission or mis-description of the property under sale regarding the numbers or any references to the number of documents, books, volumes or pages of Registrar&apos;s office, regarding the title deed of the said property shall not annul the said deed and if such error or mis-description is a material one, the VENDEES will be entitled to get it removed by the VENDOR or their attorney by obtaining a further necessary deed of assurance or supplementary deed at the cost of the VENDEES.</p></div>\n              <div className=\"flex items-start gap-2 text-justify pl-4\"><span>19.</span><p>That the VENDOR and the VENDEES have signed this Sale Deed without any pressure, influence or coercion from any side after understanding its contents, which have been fully explained to the VENDOR and the VENDEES in vernacular and which are admitted as true and correct.</p></div>\n              <div className=\"flex items-start gap-2 text-justify pl-4\"><span>20.</span><p>That the VENDEES has paid the stamp duty, transfer duty, registration charges and other incidental charges for execution of this Sale Deed.</p></div>\n            </div>\n          </div>\n        </div>\n      )}\n\n      {/* ==================== PAGE 8 OF 8 ==================== */}\n      {shouldShowPage(8) && (\n        <div ref={(el) => { pageRefs.current[7] = el; }}>\n          <PageHeaderBadge pageNum={8} title=\"Clause 21, Execution & Witnesses\" editTab={4} />\n          <div className=\"a4-page\" data-deed-page=\"8\" onClick={() => onSelectSection(4)}>\n            <div className=\"text-[10.5pt] leading-[1.65]\">\n              <div className=\"flex items-start gap-2 text-justify pl-4 mb-8\"><span>21.</span><p>That both the parties, hereto i.e. the VENDOR and the VENDEES are Indian Nationals.</p></div>\n              <p className=\"mb-6 text-justify\">IN WITNESS WHEREOF, the VENDOR and the VENDEES have set subscribed their hands to this Sale Deed on the day, month and year first mentioned above, in the presence of the following witnesses.</p>\n              <div className=\"mb-2\">WITNESSES:-</div>\n              <div className=\"flex justify-between items-start pl-4 mb-8\"><div className=\"w-[68%]\"><div className=\"mb-2\">1.</div><div className=\"live-field font-bold\">{data.witness1Honorific} {data.witness1Name}</div><div className=\"live-field\">{data.witness1RelationType} {data.witness1RelativeName}</div>{data.witness1AddressLine1 && <div className=\"live-field\">{data.witness1AddressLine1}</div>}{data.witness1AddressLine2 && <div className=\"live-field\">{data.witness1AddressLine2}</div>}{data.witness1AddressLine3 && <div className=\"live-field\">{data.witness1AddressLine3}</div>}<div className=\"live-field font-bold\">(AADHAR NO. {data.witness1Aadhar})</div></div><div className=\"w-[28%] text-center pt-0.5\">VENDOR</div></div>\n              <div className=\"flex justify-between items-start pl-4\"><div className=\"w-[68%]\"><div>2.</div><div className=\"live-field font-bold\">{data.witness2Honorific} {data.witness2Name}</div><div className=\"live-field\">{data.witness2RelationType} {data.witness2RelativeName} {data.witness2AddressLine1}</div>{data.witness2AddressLine2 && <div className=\"live-field\">{data.witness2AddressLine2}</div>}{data.witness2AddressLine3 && <div className=\"live-field\">{data.witness2AddressLine3}</div>}<div className=\"live-field font-bold\">(AADHAR NO. {data.witness2Aadhar})</div></div><div className=\"w-[28%] text-center pt-0.5\">VENDEE</div></div>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n};\n","src/types/deed.ts":"export type RelationType = 'SON OF' | 'DAUGHTER OF' | 'WIFE OF' | 'CARE OF';\nexport type ShortRelationType = 'S/O' | 'D/O' | 'W/O' | 'C/O';\nexport type HonorificType = 'SHRI' | 'SMT.' | 'KUMARI' | 'MR.' | 'MS.' | 'M/S';\nexport type DutyGenderLabel = 'For Male' | 'For Female' | 'For Joint (Male & Female)';\nexport type SaleAmountMode = 'round_lakh' | 'exact_valuation' | 'custom';\n\nexport interface SaleDeedData {\n  // Page 1: Valuation & Stamp Duty Calculation\n  colonyAreaPage1: string;\n  category: string;\n  plotAreaSqYds: number;\n  sqYdsToSqMtrFactor: number; // default 0.836 so 40 sq.yds = 33.44 Sq. Mtr.\n  totalFloorsMultiplier: number; // default 4 so 33.44 * 4 = 133.76 Sq.Mtrs.\n  saleFloorMultiplier: number; // default 1 so Plinth area under sale = 33.44 Sq.Mtrs\n  constructionMultiplier: number; // default 4 so 33.44 X 4 X 6960 = 9,30,970\n  landUse: string;\n  govLandRatePerSqMtr: number; // default 46200\n  govConstRatePerSqMtr: number; // default 6960\n  saleAmountMode: SaleAmountMode;\n  customSaleAmount: number; // default 2500000\n  dutyGenderLabel: DutyGenderLabel;\n  corpDutyPercent: number; // default 3\n  stampDutyPercent: number; // default 3\n\n  // Page 2: Execution Date, Seller (Vendor), Buyer (Vendee), Property & Boundaries\n  executionPlace: string; // default \"New Delhi\"\n  executionDateText: string; // default \"--------\" (or date string)\n\n  // Vendor (Seller)\n  vendorHonorific: HonorificType;\n  vendorName: string;\n  vendorRelationType: RelationType;\n  vendorRelativeHonorific: HonorificType;\n  vendorRelativeName: string;\n  vendorAddress: string;\n  vendorPronoun: 'her' | 'his' | 'their';\n\n  // Vendee (Buyer)\n  vendeeHonorific: HonorificType;\n  vendeeName: string;\n  vendeeRelationType: RelationType;\n  vendeeRelativeHonorific: HonorificType;\n  vendeeRelativeName: string;\n  vendeeAddress: string;\n  vendeePronoun: 'her' | 'his' | 'their';\n\n  // Property Details (Used on Page 2 & Page 3)\n  syncPropertySqYdsWithPage1: boolean;\n  propertySqYdsPage2: number; // In reference image 2 & 3 it says 52 SQ.YDS., or synced with Page 1\n  propertyTypePrefix: string; // \"BUILT-UP PROPERTY NO.\"\n  propertyHouseNo: string; // \"RZ-28/195\"\n  propertyGaliNo: string; // \"IN GALI NO 14\"\n  propertyFloorDescription: string; // \"(ENTIRE THIRD FLOOR WITH ROOF RIGHTS)\"\n  propertyKhasraNo: string; // \"195\"\n  propertyVillage: string; // \"NASIRPUR\"\n  propertyState: string; // \"DELHI STATE DELHI\"\n  propertyColony: string; // \"DURGA PARK\"\n  propertyCityPin: string; // \"NEW DELHI-110045\"\n\n  // Boundaries (Page 2 bottom)\n  boundaryEast: string;\n  boundaryWest: string;\n  boundaryNorth: string;\n  boundarySouth: string;\n\n  // Page 3: Previous Title / GPA Details\n  priorTitleDocText: string; // \"vide GPA duly Notarized by the Notary Public Delhi\"\n  priorOwnerHonorific: string; // \"SMT.\"\n  priorOwnerName: string; // \"VIMLA SHARMA\"\n  priorOwnerRelation: string; // \"Wife of\"\n  priorOwnerRelativeHonorific: string; // \"SH.\"\n  priorOwnerRelativeName: string; // \"RAVINDER SHARMA\"\n\n  // Page 6: Witnesses\n  witness1Honorific: HonorificType;\n  witness1Name: string;\n  witness1RelationType: ShortRelationType;\n  witness1RelativeName: string;\n  witness1AddressLine1: string;\n  witness1AddressLine2: string;\n  witness1AddressLine3: string;\n  witness1Aadhar: string;\n\n  witness2Honorific: HonorificType;\n  witness2Name: string;\n  witness2RelationType: ShortRelationType;\n  witness2RelativeName: string;\n  witness2AddressLine1: string;\n  witness2AddressLine2: string;\n  witness2AddressLine3: string;\n  witness2Aadhar: string;\n}\n\nexport interface CalculatedDeedMetrics {\n  plotAreaSqMtr: number; // e.g., 33.44\n  totalPlinthAreaSqMtr: number; // e.g., 133.76\n  plinthAreaUnderSaleSqMtr: number; // e.g., 33.44\n  minLandValue: number; // e.g., 1544928\n  minConstructionValue: number; // e.g., 930970\n  totalPropertyValue: number; // e.g., 2475898\n  stampDutyPaidOnAmount: number; // e.g., 2500000\n  stampDutyAmountInWords: string; // e.g., \"Rupees Twenty Five Lakh only\"\n  corpDutyAmount: number; // e.g., 75000\n  stampDutyAmount: number; // e.g., 75000\n  totalDutyPercent: number; // e.g., 6\n  totalDutyAmount: number; // e.g., 150000\n  effectivePropertySqYds: number;\n}\n\n// Delhi Government Circle Rate Presets by Category (Land Rate per Sq.Mtr & Construction Rate per Sq.Mtr)\nexport const DELHI_CATEGORY_RATES: Record<string, { landRate: number; constRate: number }> = {\n  A: { landRate: 774000, constRate: 21960 },\n  B: { landRate: 245520, constRate: 17400 },\n  C: { landRate: 159840, constRate: 13920 },\n  D: { landRate: 127680, constRate: 11160 },\n  E: { landRate: 70080, constRate: 9360 },\n  F: { landRate: 56640, constRate: 8220 },\n  G: { landRate: 46200, constRate: 6960 },\n  H: { landRate: 23280, constRate: 3480 },\n};\n\nexport const INITIAL_SALE_DEED_DATA: SaleDeedData = {\n  // Page 1 defaults matching Reference Image 1\n  colonyAreaPage1: 'DASHRATH PURI',\n  category: 'G',\n  plotAreaSqYds: 40,\n  sqYdsToSqMtrFactor: 0.836,\n  totalFloorsMultiplier: 4,\n  saleFloorMultiplier: 1,\n  constructionMultiplier: 4,\n  landUse: 'Residential',\n  govLandRatePerSqMtr: 46200,\n  govConstRatePerSqMtr: 6960,\n  saleAmountMode: 'round_lakh',\n  customSaleAmount: 2500000,\n  dutyGenderLabel: 'For Male',\n  corpDutyPercent: 3,\n  stampDutyPercent: 3,\n\n  // Page 2 defaults matching Reference Image 2\n  executionPlace: 'New Delhi',\n  executionDateText: '--------',\n\n  vendorHonorific: 'SHRI',\n  vendorName: 'NAVEN CHANDRA JOSHI',\n  vendorRelationType: 'SON OF',\n  vendorRelativeHonorific: 'SHRI',\n  vendorRelativeName: 'REWA DHAR JOSHI',\n  vendorAddress: 'RZ-49A/216 J-BLOCK,WEST SAGARPUR ,DELHI-110046',\n  vendorPronoun: 'her',\n\n  vendeeHonorific: 'SHRI',\n  vendeeName: 'MADHU VARMA',\n  vendeeRelationType: 'WIFE OF',\n  vendeeRelativeHonorific: 'SHRI',\n  vendeeRelativeName: 'KISHAN',\n  vendeeAddress: 'HN RZ C-77 NEAR JINDAL PUBLIC SCHOOL DWARIKAPURI VIJAY ENCLAVE,DELHI-110045',\n  vendeePronoun: 'her',\n\n  syncPropertySqYdsWithPage1: false,\n  propertySqYdsPage2: 52,\n  propertyTypePrefix: 'BUILT-UP PROPERTY NO.',\n  propertyHouseNo: 'RZ-28/195',\n  propertyGaliNo: 'IN GALI NO 14',\n  propertyFloorDescription: '(ENTIRE THIRD FLOOR WITH ROOF RIGHTS)',\n  propertyKhasraNo: '195',\n  propertyVillage: 'NASIRPUR',\n  propertyState: 'DELHI STATE DELHI',\n  propertyColony: 'DURGA PARK',\n  propertyCityPin: 'NEW DELHI-110045',\n\n  boundaryEast: 'PORTION OF PROPERTY.',\n  boundaryWest: 'ROAD 20 FT',\n  boundaryNorth: 'PORTION OF PROPERTY.',\n  boundarySouth: 'OTHERS PROPERTY.',\n\n  // Page 3 defaults matching Reference Image 3\n  priorTitleDocText: 'vide GPA duly Notarized by the Notary Public Delhi',\n  priorOwnerHonorific: 'SMT.',\n  priorOwnerName: 'VIMLA SHARMA',\n  priorOwnerRelation: 'Wife of',\n  priorOwnerRelativeHonorific: 'SH.',\n  priorOwnerRelativeName: 'RAVINDER SHARMA',\n\n  // Page 6 defaults matching Reference Image 6\n  witness1Honorific: 'SHRI',\n  witness1Name: 'NAME SINGH',\n  witness1RelationType: 'S/O',\n  witness1RelativeName: 'SHRI PAL SINGH',\n  witness1AddressLine1: 'RZ-C-56,DWARKAPURI,',\n  witness1AddressLine2: 'VIJAY ENCLAVE,DABRI,',\n  witness1AddressLine3: 'SOUTH WEST DELHI-110045',\n  witness1Aadhar: '9666-3937-0106',\n\n  witness2Honorific: 'SHRI',\n  witness2Name: 'SATENDRA KUMAR SHARMA',\n  witness2RelationType: 'S/O',\n  witness2RelativeName: 'THAKUR PRASAD SHARMA',\n  witness2AddressLine1: 'RZ-A-2/47,GALI NO-2A,DURGA PARK,NASIR',\n  witness2AddressLine2: 'PUR,SOUTH WEST DELHI-110045',\n  witness2AddressLine3: '',\n  witness2Aadhar: '6561-4057-9528',\n};\n","src/utils/calculations.ts":"import { CalculatedDeedMetrics, SaleDeedData } from '../types/deed';\n\n/**\n * Formats a number in the Indian numbering system (e.g. 2500000 -> \"25,00,000\")\n */\nexport function formatIndianNumber(num: number): string {\n  if (!Number.isFinite(num)) return '0';\n  const rounded = Math.round(num);\n  return rounded.toLocaleString('en-IN');\n}\n\n/**\n * Formats a decimal number cleanly to 2 decimal places (e.g. 33.44, 133.76, 41.80)\n */\nexport function formatSqMtr(num: number): string {\n  if (!Number.isFinite(num)) return '0.00';\n  // Keep 2 decimals just like 33.44 and 133.76 in reference image\n  return num.toFixed(2);\n}\n\nconst ONES = [\n  '',\n  'One',\n  'Two',\n  'Three',\n  'Four',\n  'Five',\n  'Six',\n  'Seven',\n  'Eight',\n  'Nine',\n  'Ten',\n  'Eleven',\n  'Twelve',\n  'Thirteen',\n  'Fourteen',\n  'Fifteen',\n  'Sixteen',\n  'Seventeen',\n  'Eighteen',\n  'Nineteen',\n];\n\nconst TENS = [\n  '',\n  '',\n  'Twenty',\n  'Thirty',\n  'Forty',\n  'Fifty',\n  'Sixty',\n  'Seventy',\n  'Eighty',\n  'Ninety',\n];\n\nfunction twoDigitToWords(n: number): string {\n  if (n === 0) return '';\n  if (n < 20) return ONES[n];\n  const ten = Math.floor(n / 10);\n  const rem = n % 10;\n  return `${TENS[ten]}${rem > 0 ? ' ' + ONES[rem] : ''}`;\n}\n\n/**\n * Converts a number into Indian Legal Words format\n * e.g. 2500000 -> \"Rupees Twenty Five Lakh only\"\n */\nexport function numberToIndianRupeesWords(amount: number): string {\n  const n = Math.floor(Math.abs(amount));\n  if (n === 0) return 'Rupees Zero only';\n\n  const parts: string[] = [];\n  let remaining = n;\n\n  const crore = Math.floor(remaining / 10000000);\n  remaining %= 10000000;\n\n  const lakh = Math.floor(remaining / 100000);\n  remaining %= 100000;\n\n  const thousand = Math.floor(remaining / 1000);\n  remaining %= 1000;\n\n  const hundred = Math.floor(remaining / 100);\n  const lastTwo = remaining % 100;\n\n  if (crore > 0) {\n    if (crore >= 100) {\n      const cHundred = Math.floor(crore / 100);\n      const cRem = crore % 100;\n      parts.push(\n        `${ONES[cHundred]} Hundred${cRem > 0 ? ' ' + twoDigitToWords(cRem) : ''} Crore`\n      );\n    } else {\n      parts.push(`${twoDigitToWords(crore)} Crore`);\n    }\n  }\n\n  if (lakh > 0) {\n    parts.push(`${twoDigitToWords(lakh)} Lakh`);\n  }\n\n  if (thousand > 0) {\n    parts.push(`${twoDigitToWords(thousand)} Thousand`);\n  }\n\n  if (hundred > 0) {\n    parts.push(`${ONES[hundred]} Hundred`);\n  }\n\n  if (lastTwo > 0) {\n    parts.push(twoDigitToWords(lastTwo));\n  }\n\n  return `Rupees ${parts.join(' ')} only`;\n}\n\n/**\n * Computes all automatic Page 1 & Page 4 metrics from SaleDeedData\n */\nexport function calculateDeedMetrics(data: SaleDeedData): CalculatedDeedMetrics {\n  const plotSqYds = Math.max(0, Number(data.plotAreaSqYds) || 0);\n  const factor = Number(data.sqYdsToSqMtrFactor) || 0.836;\n\n  // Round to 2 decimal places so 40 * 0.836 = 33.44 exactly\n  const plotAreaSqMtr = Number((plotSqYds * factor).toFixed(2));\n\n  const totalFloorsMult = Number(data.totalFloorsMultiplier) || 4;\n  const saleFloorMult = Number(data.saleFloorMultiplier) || 1;\n  const constMult = Number(data.constructionMultiplier) || 4;\n\n  const totalPlinthAreaSqMtr = Number((plotAreaSqMtr * totalFloorsMult).toFixed(2));\n  const plinthAreaUnderSaleSqMtr = Number((plotAreaSqMtr * saleFloorMult).toFixed(2));\n\n  const landRate = Number(data.govLandRatePerSqMtr) || 0;\n  const constRate = Number(data.govConstRatePerSqMtr) || 0;\n\n  // Minimum value of land: e.g. 33.44 * 46200 = 1544928\n  const minLandValue = Math.round(plotAreaSqMtr * landRate);\n\n  // Minimum value of Construction: e.g. 33.44 * 4 * 6960 = 930969.6 -> 930970\n  const minConstructionValue = Math.round(plotAreaSqMtr * constMult * constRate);\n\n  // Total Value of Property: e.g. 1544928 + 930970 = 2475898\n  const totalPropertyValue = minLandValue + minConstructionValue;\n\n  let stampDutyPaidOnAmount = totalPropertyValue;\n  if (data.saleAmountMode === 'round_lakh') {\n    // Round up to nearest 1,00,000 (so 24,75,898 -> 25,00,000 and 30,94,872 -> 31,00,000)\n    stampDutyPaidOnAmount =\n      totalPropertyValue > 0 ? Math.ceil(totalPropertyValue / 100000) * 100000 : 0;\n  } else if (data.saleAmountMode === 'custom') {\n    stampDutyPaidOnAmount = Math.max(0, Number(data.customSaleAmount) || 0);\n  } else {\n    stampDutyPaidOnAmount = totalPropertyValue;\n  }\n\n  const stampDutyAmountInWords = numberToIndianRupeesWords(stampDutyPaidOnAmount);\n\n  const corpDutyPercent = Number(data.corpDutyPercent) || 0;\n  const stampDutyPercent = Number(data.stampDutyPercent) || 0;\n  const totalDutyPercent = Number((corpDutyPercent + stampDutyPercent).toFixed(2));\n\n  const corpDutyAmount = Math.round((stampDutyPaidOnAmount * corpDutyPercent) / 100);\n  const stampDutyAmount = Math.round((stampDutyPaidOnAmount * stampDutyPercent) / 100);\n  const totalDutyAmount = corpDutyAmount + stampDutyAmount;\n\n  const effectivePropertySqYds = data.syncPropertySqYdsWithPage1\n    ? plotSqYds\n    : Number(data.propertySqYdsPage2) || plotSqYds;\n\n  return {\n    plotAreaSqMtr,\n    totalPlinthAreaSqMtr,\n    plinthAreaUnderSaleSqMtr,\n    minLandValue,\n    minConstructionValue,\n    totalPropertyValue,\n    stampDutyPaidOnAmount,\n    stampDutyAmountInWords,\n    corpDutyAmount,\n    stampDutyAmount,\n    totalDutyPercent,\n    totalDutyAmount,\n    effectivePropertySqYds,\n  };\n}\n\n/**\n * Helper to build the full bold property description string used on Page 2 & Page 3\n */\nexport function buildFullPropertyDescription(\n  data: SaleDeedData,\n  metrics: CalculatedDeedMetrics\n): {\n  mainBlock: string;\n  cityPin: string;\n  combinedPage3: string;\n} {\n  const parts: string[] = [];\n  if (data.propertyTypePrefix.trim()) {\n    parts.push(`${data.propertyTypePrefix.trim()} ${data.propertyHouseNo.trim()}`);\n  } else if (data.propertyHouseNo.trim()) {\n    parts.push(data.propertyHouseNo.trim());\n  }\n\n  const galiAndFloor = [data.propertyGaliNo.trim(), data.propertyFloorDescription.trim()]\n    .filter(Boolean)\n    .join(' ');\n\n  const firstSegment = [parts.join(' '), galiAndFloor].filter(Boolean).join(',');\n\n  const subSegments: string[] = [];\n  if (firstSegment) subSegments.push(firstSegment);\n  subSegments.push(`LAND AREA MEASURING ${metrics.effectivePropertySqYds} SQ.YDS.`);\n  if (data.propertyKhasraNo.trim()) {\n    subSegments.push(`OUT OF KHASRA NO. ${data.propertyKhasraNo.trim()}`);\n  }\n  if (data.propertyVillage.trim()) {\n    subSegments.push(\n      `SITUATED IN THE AREA OF VILLAGE ${data.propertyVillage.trim()}, ${data.propertyState.trim()}`\n    );\n  }\n  if (data.propertyColony.trim()) {\n    subSegments.push(`COLONY KNOWN AS ${data.propertyColony.trim()} `);\n  }\n\n  const mainBlock = `${subSegments.join(', ')},`;\n  const cityPin = `${data.propertyCityPin.trim()},`;\n  const combinedPage3 = `${mainBlock} ${cityPin}`;\n\n  return { mainBlock, cityPin, combinedPage3 };\n}\n","src/utils/wordExport.ts":"import {\n  AlignmentType,\n  BorderStyle,\n  Document,\n  Packer,\n  PageBreak,\n  Paragraph,\n  Table,\n  TableCell,\n  TableRow,\n  TextRun,\n  UnderlineType,\n  WidthType,\n} from 'docx';\nimport { CalculatedDeedMetrics, SaleDeedData } from '../types/deed';\nimport {\n  buildFullPropertyDescription,\n  formatIndianNumber,\n  formatSqMtr,\n} from './calculations';\n\nconst FONT_FAMILY = 'Verdana';\nconst FONT_SIZE = 22; // 11pt in half-points\n\nfunction createText(\n  text: string,\n  options?: {\n    bold?: boolean;\n    italics?: boolean;\n    underline?: boolean;\n    size?: number;\n  }\n): TextRun {\n  return new TextRun({\n    text,\n    font: FONT_FAMILY,\n    size: options?.size ?? FONT_SIZE,\n    bold: options?.bold ?? false,\n    italics: options?.italics ?? false,\n    underline: options?.underline ? { type: UnderlineType.SINGLE } : undefined,\n  });\n}\n\nfunction makeTableRow(leftText: string, rightText: string): TableRow {\n  const cellBorders = {\n    top: { style: BorderStyle.SINGLE, size: 6, color: '000000' },\n    bottom: { style: BorderStyle.SINGLE, size: 6, color: '000000' },\n    left: { style: BorderStyle.SINGLE, size: 6, color: '000000' },\n    right: { style: BorderStyle.SINGLE, size: 6, color: '000000' },\n  };\n\n  return new TableRow({\n    children: [\n      new TableCell({\n        width: { size: 52, type: WidthType.PERCENTAGE },\n        borders: cellBorders,\n        margins: { top: 100, bottom: 100, left: 140, right: 120 },\n        children: [\n          new Paragraph({\n            children: [createText(leftText, { size: 21 })],\n          }),\n        ],\n      }),\n      new TableCell({\n        width: { size: 48, type: WidthType.PERCENTAGE },\n        borders: cellBorders,\n        margins: { top: 100, bottom: 100, left: 140, right: 120 },\n        children:  power to sell and transfer the same in any manner.</p>\n      <p>AND WHEREAS the VENDOR has full power and absolute authority to sell and transfer the aforesaid property unto the VENDEES, and to receive the sale consideration in ${data.vendorPronoun} own name and neither anyone else has any right, title and interest in the aforesaid property nor there is any legal impediment which prohibits the VENDOR to sell the same unto the VENDEES.</p>\n      <p>AND WHEREAS the VENDOR has agreed to sell, convey, transfer and assign ${data.vendorPronoun} all rights, titles and interests in the aforesaid <b>${propDesc.combinedPage3}</b></p>\n      <p>hereinafter referred to as ”the said property”, alongwith all benefits, facilities, privileges, easements or advantages belonging to or in any way appertaining to the said property to the VENDEES.</p>\n      <p>AND WHEREAS the VENDEES has agreed to purchase, acquire and possess the said property relying on the various assurances, covenants, representations, statements and undertaking given by the VENDOR and believing the same to be true and acting on the faith thereof and on the terms and conditions mentioned hereunder.</p>\n\n      <p style=\"text-align:right; font-size:9pt; margin:10pt 0 0 0;\">Contd...5/-</p>\n      <br clear=\"all\" style=\"page-break-before:always\" />\n\n      <!-- PAGE 4 -->\n      <p style=\"text-align:center; font-weight:bold; margin:0 0 12pt 0;\">-::5::-</p>\n      <p style=\"margin-top:16pt; font-weight:bold; text-decoration:underline;\">NOW THIS SALE DEED WITNESSESTH AS UNDER:-</p>\n      <p style=\"margin-left:24pt; text-indent:-18pt;\">1. &nbsp; That in consideration of the said sum of <b>Rs.${formatIndianNumber(metrics.stampDutyPaidOnAmount)}/- (${metrics.stampDutyAmountInWords}).</b>, the VENDOR hereby sell, convey, alienate and transfer all ${data.vendorPronoun} rights, titles and interests in the said property, along with boundary wall, fittings, fixtures and super structure thereon and all other estate rights whatsoever, including all easements, appurtenances to the said property as also enjoyed or reputed to be enjoyed therewith unto the VENDEES, in perfect and absolute ownership without any hindrance, disturbance, whatsoever, TO HAVE, TO HOLD AND TO ENJOY THE SAME ABSOLUTELY AND FOREVER.</p>\n      <p style=\"margin-left:24pt; text-indent:-18pt;\">2. &nbsp; That the said consideration has already been paid by the VENDEES to the VENDOR in the following manner:-</p>\n      <table width=\"100%\" border=\"1\"><tr><td>Amount</td><td>Chq./D.D./P.O. No.</td><td>Dated</td><td>Name of Bank</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></table>\n      <p>as full and final payment/settlement towards the sale price of the said property, and the legal receipt of the same is hereby admitted and acknowledged by the VENDOR.</p>\n      <p style=\"margin-left:24pt; text-indent:-18pt;\">3. &nbsp; That the VENDOR hereby explicitly admits and declares that having received the aforesaid consideration in full and final payment, now nothing is left due from the VENDEES to the VENDOR against sale consideration for the purchase of the said property, as the aforesaid consideration represents the full and final consideration for the transaction.</p>\n      <p style=\"margin-left:24pt; text-indent:-18pt;\">4. &nbsp; That the VENDOR has delivered the peaceful and actual physical vacant possession of the said property unto the VENDEES on the spot.</p>\n      <p style=\"margin-left:24pt; text-indent:-18pt;\">6. &nbsp; That the VENDOR hereby sell, grant, convey, transfer and assign, with the ownership rights of the said property together with the super structure thereon, unto the VENDEES, and the VENDOR hereby transfers ${data.vendorPronoun} all rights, titles and interests, along with all the rights, privileges, easements and appurtenances, whatsoever in the said property, belong and usually held herewith including all electric, water and all the estate right, title, and interest in the said property, hereby conveyed, and every part thereof TO HAVE AND TO HOLD THE SAME unto the VENDEES absolutely and forever.</p>\n\n      <p style=\"text-align:right; font-size:9pt; margin:10pt 0 0 0;\">Contd...6/-</p>\n      <br clear=\"all\" style=\"page-break-before:always\" />\n\n      <!-- PAGE 5 -->\n      <p style=\"text-align:center; font-weight:bold; margin:0 0 12pt 0;\">-::6::-</p>\n      <p style=\"margin-top:16pt; margin-left:24pt; text-indent:-18pt;\">5. &nbsp; That the VENDOR hereby assure the VENDEES that the said property, hereby conveyed, is free from all sorts of charges, encumbrances, liens, loan, claims, demands, and liabilities, surety, security, legal flaws, disputes, sale, mortgage, gift, liabilities, disabilities, injunction, notifications for acquisitions/requisition, and if ever it is proved to be otherwise and the VENDEES suffers, due to any legal defect in the title of the VENDOR, any loss and/or whole or any part of the said property, hereby conveyed, is taken away from the possession of the VENDEES, then the VENDOR will make good the losses thus suffered by the VENDEES in this regard and shall keep the VENDEES indemnified against all losses, costs, damages and expenses accruing thereby to the VENDEES.</p>\n      <p style=\"margin-left:24pt; text-indent:-18pt;\">7. &nbsp; That the VENDOR hereby further assure the VENDEES that ${data.vendorPronoun === 'his' ? 'he' : 'she'} or anyone else claiming from or through the VENDOR has not created any encumbrances or license or restriction thereon nor is there any claim or litigation or legal proceeding injunction or attachment concerning the said property.</p>\n      <p style=\"margin-left:24pt; text-indent:-18pt;\">8. &nbsp; That the VENDOR now admits that ${data.vendorPronoun === 'his' ? 'he' : 'she'} has been left with no right, title and interest of any nature, whatsoever may be in the said property, and the VENDEES has become the absolute owner of the same and or maintenance and repair of common amenities and services of the said building.</p>\n      <p>14. That the VENDEES shall have proportionate rights in the land according to their ownership whenever the property/building collapses due to any calamity like earthquake, flood, fire, etc.</p>\n      <p>15. That the VENDEES or any other occupant/owner of the building will not obstruct the staircase or common passage by keeping a dustbin or any kind of item.</p>\n\n      <p style=\"text-align:right; font-size:9pt; margin:10pt 0 0 0;\">Contd...8/-</p>\n      <br clear=\"all\" style=\"page-break-before:always\" />\n      <!-- PAGE 7 -->\n      <p style=\"text-align:center; font-weight:bold; margin:0 0 12pt 0;\">-::8::-</p>\n      <p>16. That the VENDEES or any other occupant/owner of the building shall not disturb or remove the basic and fundamental structure such as columns, beams and facing walls of the building.</p>\n      <p>17. That the owners/occupants of upper ground, first and second floors can go on the roof of the top floor for installation, inspection or repair of their water tank and T.V./Dish Antenna at reasonable hours.</p>\n      <p>18. That any error or omission or mis-description regarding numbers or references to documents, books, volumes or pages of the Registrar's office relating to the title deed shall not annul the deed; if material, the VENDEES may get it corrected by a supplementary deed at their cost.</p>\n      <p>19. That the VENDOR and VENDEES have signed this Sale Deed without pressure, influence or coercion after understanding its contents, which have been explained in vernacular and admitted as true and correct.</p>\n      <p>20. That the VENDEES has paid the stamp duty, transfer duty, registration charges and other incidental charges for execution of this Sale Deed.</p>\n\n      <p style=\"text-align:right; font-size:9pt; margin:10pt 0 0 0;\">Contd...9/-</p>\n      <br clear=\"all\" style=\"page-break-before:always\" />\n      <!-- PAGE 8 -->\
