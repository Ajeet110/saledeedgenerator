const SOURCES = {"/src/utils/deed.tsx": "export type Gender = \"M\" | \"F\";\n\nexport interface Party {\n  title: string;\n  name: string;\n  relation: string;\n  relName: string;\n  address: string;\n  gender: Gender;\n}\n\nexport interface Witness {\n  name: string;\n  parentage: string;\n  address: string;\n  aadhar: string;\n}\n\nexport interface Deed {\n  // value & area (page 1)\n  consideration: string;\n  plotYds: string;\n  sqmFactor: string;\n  floors: string;\n  landRate: string;\n  consRate: string;\n  corpPct: string;\n  stampPct: string;\n  category: string;\n  landUse: string;\n  // deed\n  place: string;\n  date: string;\n  sellers: Party[];\n  buyers: Party[];\n  // property\n  colony: string;\n  propNo: string;\n  gali: string;\n  floor: string;\n  khasra: string;\n  village: string;\n  district: string;\n  city: string;\n  pincode: string;\n  prevOwner: string;\n  east: string;\n  west: string;\n  north: string;\n  south: string;\n  // witnesses\n  witness1: Witness;\n  witness2: Witness;\n}\n\nexport const RELATIONS = [\"SON OF\", \"DAUGHTER OF\", \"WIFE OF\", \"CARE OF\", \"WIDOW OF\"];\nexport const TITLES = [\"SHRI\", \"SMT.\", \"KUMARI\", \"MS.\", \"MR.\", \"MRS.\"];\n\nexport const emptyParty = (gender: Gender = \"M\"): Party => ({\n  title: gender === \"M\" ? \"SHRI\" : \"SMT.\",\n  name: \"\",\n  relation: gender === \"M\" ? \"SON OF\" : \"WIFE OF\",\n  relName: \"\",\n  address: \"\",\n  gender,\n});\n\nconst emptyWitness: Witness = { name: \"\", parentage: \"\", address: \"\", aadhar: \"\" };\n\nexport const blankDeed = (): Deed => ({\n  consideration: \"\",\n  plotYds: \"50\",\n  sqmFactor: \"0.836\",\n  floors: \"4\",\n  landRate: \"\",\n  consRate: \"6960\",\n  corpPct: \"3\",\n  stampPct: \"3\",\n  category: \"\",\n  landUse: \"Residential\",\n  place: \"New Delhi\",\n  date: \"\",\n  sellers: [emptyParty(\"M\")],\n  buyers: [emptyParty(\"F\")],\n  colony: \"\",\n  propNo: \"\",\n  gali: \"\",\n  floor: \"\",\n  khasra: \"\",\n  village: \"\",\n  district: \"DELHI STATE DELHI\",\n  city: \"NEW DELHI\",\n  pincode: \"\",\n  prevOwner: \"\",\n  east: \"\",\n  west: \"\",\n  north: \"\",\n  south: \"\",\n  witness1: { ...emptyWitness },\n  witness2: { ...emptyWitness },\n});\n\nexport const sampleDeed = (): Deed => ({\n  consideration: \"2500000\",\n  plotYds: \"50\",\n  sqmFactor: \"0.836\",\n  floors: \"4\",\n  landRate: \"46200\",\n  consRate: \"6960\",\n  corpPct: \"3\",\n  stampPct: \"3\",\n  category: \"G\",\n  landUse: \"Residential\",\n  place: \"New Delhi\",\n  date: \"\",\n  sellers: [\n    {\n      title: \"SHRI\",\n      name: \"NAVEN CHANDRA JOSHI\",\n      relation: \"SON OF\",\n      relName: \"SHRI REWA DHAR JOSHI\",\n      address: \"RZ-49A/216 J-BLOCK, WEST SAGARPUR, DELHI-110046\",\n      gender: \"M\",\n    },\n  ],\n  buyers: [\n    {\n      title: \"SMT.\",\n      name: \"MADHU VARMA\",\n      relation: \"WIFE OF\",\n      relName: \"SHRI KISHAN\",\n      address:\n        \"HN RZ C-77 NEAR JINDAL PUBLIC SCHOOL DWARIKAPURI VIJAY ENCLAVE, DELHI-110045\",\n      gender: \"F\",\n    },\n  ],\n  colony: \"DURGA PARK\",\n  propNo: \"RZ-28/195\",\n  gali: \"GALI NO 14\",\n  floor: \"ENTIRE THIRD FLOOR WITH ROOF RIGHTS\",\n  khasra: \"195\",\n  village: \"NASIRPUR\",\n  district: \"DELHI STATE DELHI\",\n  city: \"NEW DELHI\",\n  pincode: \"110045\",\n  prevOwner: \"SMT. VIMLA SHARMA Wife of SH. RAVINDER SHARMA\",\n  east: \"PORTION OF PROPERTY.\",\n  west: \"ROAD 20 FT\",\n  north: \"PORTION OF PROPERTY.\",\n  south: \"OTHERS PROPERTY.\",\n  witness1: {\n    name: \"SHRI NAME SINGH\",\n    parentage: \"S/O SHRI PAL SINGH\",\n    address: \"RZ-C-56, DWARKAPURI, VIJAY ENCLAVE, DABRI, SOUTH WEST DELHI-110045\",\n    aadhar: \"9666-3937-0106\",\n  },\n  witness2: {\n    name: \"SHRI SATENDRA KUMAR SHARMA\",\n    parentage: \"S/O THAKUR PRASAD SHARMA\",\n    address: \"RZ-A-2/47, GALI NO-2A, DURGA PARK, NASIRPUR, SOUTH WEST DELHI-110045\",\n    aadhar: \"6561-4057-9528\",\n  },\n});\n\n/* ---------- number helpers ---------- */\n\nexport const num = (s: string | number): number => {\n  const n = typeof s === \"number\" ? s : parseFloat(String(s).replace(/,/g, \"\"));\n  return Number.isFinite(n) ? n : 0;\n};\n\nconst round2 = (n: number) => Math.round((n + Number.EPSILON) * 100) / 100;\n\n/** Indian digit grouping: 2500000 -> 25,00,000 */\nexport const inr = (n: number, maxDecimals = 2): string => {\n  const fixed = n.toFixed(maxDecimals);\n  let [int, dec = \"\"] = fixed.split(\".\");\n  dec = dec.replace(/0+$/, \"\");\n  const neg = int.startsWith(\"-\");\n  if (neg) int = int.slice(1);\n  let last3 = int.slice(-3);\n  const rest = int.slice(0, -3);\n  if (rest) last3 = \",\" + last3;\n  const grouped = rest.replace(/\\B(?=(\\d{2})+(?!\\d))/g, \",\") + last3;\n  return (neg ? \"-\" : \"\") + grouped + (dec ? \".\" + dec : \"\");\n};\n\nexport const rs = (n: number) => `Rs.${inr(n)}/-`;\n\nconst ONES = [\n  \"\", \"One\", \"Two\", \"Three\", \"Four\", \"Five\", \"Six\", \"Seven\", \"Eight\", \"Nine\", \"Ten\",\n  \"Eleven\", \"Twelve\", \"Thirteen\", \"Fourteen\", \"Fifteen\", \"Sixteen\", \"Seventeen\",\n  \"Eighteen\", \"Nineteen\",\n];\nconst TENS = [\"\", \"\", \"Twenty\", \"Thirty\", \"Forty\", \"Fifty\", \"Sixty\", \"Seventy\", \"Eighty\", \"Ninety\"];\n\nconst two = (n: number) =>\n  n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? \" \" + ONES[n % 10] : \"\");\n\nconst three = (n: number) => {\n  const h = Math.floor(n / 100);\n  const r = n % 100;\n  return [h ? ONES[h] + \" Hundred\" : \"\", r ? two(r) : \"\"].filter(Boolean).join(\" \");\n};\n\nexport const wordsIN = (value: number): string => {\n  const n = Math.floor(value);\n  if (n <= 0) return \"Zero\";\n  const crore = Math.floor(n / 1e7);\n  const lakh = Math.floor((n % 1e7) / 1e5);\n  const thousand = Math.floor((n % 1e5) / 1e3);\n  const rest = n % 1000;\n  return [\n    crore ? wordsIN(crore) + \" Crore\" : \"\",\n    lakh ? two(lakh) + \" Lakh\" : \"\",\n    thousand ? two(thousand) + \" Thousand\" : \"\",\n    rest ? three(rest) : \"\",\n  ]\n    .filter(Boolean)\n    .join(\" \");\n};\n\nconst ordinal = (n: number) => {\n  const s = [\"th\", \"st\", \"nd\", \"rd\"];\n  const v = n % 100;\n  return n + (s[(v - 20) % 10] || s[v] || s[0]);\n};\n\nexport const MONTHS = [\n  \"January\", \"February\", \"March\", \"April\", \"May\", \"June\", \"July\", \"August\",\n  \"September\", \"October\", \"November\", \"December\",\n];\n\nexport const dateText = (iso: string): string => {\n  if (!iso) return \"--------\";\n  const [y, m, d] = iso.split(\"-\").map(Number);\n  if (!y || !m || !d) return \"--------\";\n  return `${ordinal(d)} day of ${MONTHS[m - 1]}, ${y}`;\n};\n\n/* ---------- calculations (page 1) ---------- */\n\nexport interface Calc {\n  yds: number;\n  sqm: number;\n  floors: number;\n  plinthTotal: number;\n  plinthSale: number;\n  parkingArea: number;\n  landRate: number;\n  consRate: number;\n  landValue: number;\n  consValue: number;\n  parkingDuty: number;\n  totalValue: number;\n  consideration: number;\n  dutyBase: number;\n  corpPct: number;\n  stampPct: number;\n  corp: number;\n  stamp: number;\n  totalDuty: number;\n}\n\nexport const calculate = (d: Deed): Calc => {\n  const yds = num(d.plotYds);\n  const sqm = round2(yds * (num(d.sqmFactor) || 0.836));\n  const floors = num(d.floors);\n  const safeFloors = floors > 0 ? floors : 1;\n  const plinthTotal = Math.round(sqm * floors * 10) / 10;\n  const parkingArea = Math.floor((sqm / safeFloors) * 100) / 100;\n  const landRate = num(d.landRate);\n  const consRate = num(d.consRate);\n  // Valuation follows the attached deed specimen: land value is apportioned\n  // by number of floors; construction and parking are valued separately.\n  const landValue = Math.floor((sqm * landRate) / safeFloors);\n  const consValue = Math.round(sqm * consRate);\n  const parkingDuty = Math.round(parkingArea * consRate);\n  const totalValue = landValue + consValue + parkingDuty;\n  const consideration = num(d.consideration);\n  const dutyBase = Math.max(consideration, totalValue);\n  const corpPct = num(d.corpPct);\n  const stampPct = num(d.stampPct);\n  const corp = Math.round((dutyBase * corpPct) / 100);\n  const stamp = Math.round((dutyBase * stampPct) / 100);\n  return {\n    yds, sqm, floors, plinthTotal, plinthSale: sqm, parkingArea,\n    landRate, consRate, landValue, consValue, parkingDuty, totalValue,\n    consideration, dutyBase, corpPct, stampPct, corp, stamp,\n    totalDuty: corp + stamp,\n  };\n};\n\n\n/* ---------- pronouns ---------- */\n\nexport const pronouns = (parties: Party[]) => {\n  if (parties.length > 1) return { poss: \"their\", subj: \"they\" };\n  if (parties[0]?.gender === \"M\") return { poss: \"his\", subj: \"he\" };\n  return { poss: \"her\", subj: \"she\" };\n};\n", "/src/deedStyles.tsx": "/** Styles shared by the on-screen preview, print and the Word export */\nexport const deedCss = `\n.deed-page{font-family:Verdana,Tahoma,Arial,sans-serif;font-size:10pt;line-height:1.85;color:#000;text-align:justify;background:#fff;width:210mm;min-height:297mm;box-sizing:border-box;padding:22mm 20mm 18mm 22mm;}\n.deed-page p{margin:0 0 11pt 0;}\n.deed-page .center{text-align:center;}\n.deed-page .right{text-align:right;}\n.deed-page table.desc{width:100%;border-collapse:collapse;margin-top:14pt;}\n.deed-page table.desc td{border:1px solid #000;padding:3pt 6pt;font-size:8.5pt;line-height:1.5;text-align:left;vertical-align:middle;}\n.deed-page table.bounds{width:100%;border-collapse:collapse;margin-top:6pt;}\n.deed-page table.bounds td{padding:4pt 0;font-size:9pt;text-align:left;vertical-align:top;border:none;}\n.deed-page table.wit{width:100%;border-collapse:collapse;}\n.deed-page table.wit td{padding:0;border:none;text-align:left;vertical-align:top;font-size:9.5pt;}\n.deed-page .cl{margin-left:9mm;text-indent:-9mm;margin-bottom:14pt;}\n.deed-page .cl2{margin-left:9mm;text-indent:-9mm;margin-bottom:11pt;}\n.deed-page .wblock{margin:0 0 6pt 9mm;font-size:9.5pt;line-height:1.45;text-align:left;}\n\n.deed-page .doc-number{text-align:center;font-weight:400;margin:0 0 12pt 0;line-height:1.2;}\n.deed-page .continuation{text-align:right;margin-top:12pt;font-size:9pt;}\n.deed-page .payment-table{width:100%;border-collapse:collapse;margin:12pt 0 8pt;}\n.deed-page .payment-table td{border-bottom:1px solid #000;padding:4pt 2pt;font-size:8.5pt;text-align:left;}\n.deed-page .cl{margin-left:9mm;text-indent:-9mm;margin-bottom:12pt;}\n.deed-page .cl2{margin-left:9mm;text-indent:-9mm;margin-bottom:10pt;}\n.deed-page .desc td{font-size:8.2pt;}\n.deed-page .small{font-size:9pt;}\n`;\n\nexport const screenCss = `\n.deed-page{box-shadow:0 1px 3px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.12);margin:0 auto;}\n.page-cap{width:210mm;margin:0 auto 6px auto;font:600 12px/1 system-ui,sans-serif;color:#64748b;letter-spacing:.04em;text-transform:uppercase;}\n.page-wrap{margin-bottom:28px;}\n`;\n\nexport const printCss = `\n@page{size:A4;margin:0;}\n@media print{\n  html,body{background:#fff !important;}\n  .zoom-wrap{zoom:1 !important;}\n  .page-cap{display:none !important;}\n  .page-wrap{margin:0 !important;}\n  .deed-page{box-shadow:none !important;margin:0 !important;min-height:0 !important;break-after:page;page-break-after:always;}\n  .page-wrap:last-child .deed-page{break-after:auto;page-break-after:auto;}\n}\n`;\n\n/** Extra CSS for the exported .doc file (Word flows the content itself) */\nexport const wordCss = `\n@page Section1{size:595.3pt 841.9pt;margin:56.7pt 56.7pt 56.7pt 62pt;}\ndiv.Section1{page:Section1;}\n.deed-page{width:auto !important;min-height:0 !important;padding:0 !important;box-shadow:none !important;margin:0 !important;}\n`;\n", "/src/components/DeedPages.tsx": "import { forwardRef } from \"react\";\nimport type { Deed, Party, Witness } from \"../utils/deed\";\nimport { calculate, dateText, inr, pronouns, rs, wordsIN } from \"../utils/deed\";\nimport { deedCss, printCss, screenCss } from \"../deedStyles\";\n\nconst BLANK = \"______________\";\nconst U = (s: string, ph = BLANK) => (s && s.trim() ? s.trim().toUpperCase() : ph);\n\nconst partyText = (p: Party) =>\n  `${p.title} ${U(p.name)} ${p.relation} ${U(p.relName)} RESIDENT OF ${U(p.address)}`;\nconst partiesText = (ps: Party[]) => ps.map(partyText).join(\" AND \");\n\nfunction propertyText(d: Deed) {\n  const yds = d.plotYds.trim() || BLANK;\n  const gali = d.gali.trim() ? `, ${U(d.gali)}` : \"\";\n  return (\n    `${U(d.floor, \"PORTION OF PROPERTY\")} OUT OF BUILT-UP PROPERTY NO. ${U(d.propNo)}${gali}, AREA MEASURING ${yds} SQ.YDS., ` +\n    `OUT OF KHASRA NO. ${U(d.khasra)}, SITUATED IN THE REVENUE ESTATE OF VILLAGE ${U(d.village)}, ` +\n    `COLONY KNOWN AS ${U(d.colony)}, ${U(d.city, \"NEW DELHI\")}${d.pincode.trim() ? \"-\" + d.pincode.trim() : \"\"}`\n  );\n}\nconst cityPin = (d: Deed) =>\n  `${U(d.city, \"NEW DELHI\")}${d.pincode.trim() ? \"-\" + d.pincode.trim() : \"\"}`;\n\nfunction Page({ docNo, children }: { docNo: number; children: React.ReactNode }) {\n  return (\n    <div className=\"page-wrap\">\n      <div className=\"page-cap\">Deed page -::{docNo}::-</div>\n      <section className=\"deed-page\">\n        <div className=\"doc-number\">-::{docNo}::-</div>\n        {children}\n      </section>\n    </div>\n  );\n}\n\nfunction WitnessBlock({ w, idx, role }: { w: Witness; idx: number; role: string }) {\n  return (\n    <>\n      <table className=\"wit\">\n        <tbody>\n          <tr>\n            <td style={{ width: \"72%\" }}>{idx}.</td>\n            <td>{role}</td>\n          </tr>\n        </tbody>\n      </table>\n      <div className=\"wblock\">\n        <b>{U(w.name)}</b>\n        <br />\n        {U(w.parentage, \"S/O ______________\")}\n        <br />\n        {U(w.address)}\n        <br />\n        <b>(AADHAR NO. {w.aadhar.trim() || \"____-____-____\"})</b>\n      </div>\n    </>\n  );\n}\n\nconst DeedPages = forwardRef<HTMLDivElement, { deed: Deed }>(({ deed: d }, ref) => {\n  const c = calculate(d);\n  const sellerP = pronouns(d.sellers);\n  const buyerP = pronouns(d.buyers);\n  const prop = propertyText(d);\n  const cityRaw = d.city.trim();\n  const notaryCity = !cityRaw || /delhi/i.test(cityRaw)\n    ? \"Delhi\"\n    : cityRaw.charAt(0).toUpperCase() + cityRaw.slice(1).toLowerCase();\n  const saleStr = c.consideration ? `Rs.${inr(c.consideration)}/-` : \"Rs. ______________/-\";\n  const words = c.consideration ? `(Rupees ${wordsIN(c.consideration)} only)` : \"(Rupees ______________ only)\";\n  const category = d.buyers.length > 1 ? \"For Joint\" : d.buyers[0]?.gender === \"F\" ? \"For Female\" : \"For Male\";\n  const pctTotal = c.corpPct + c.stampPct;\n  const V = \"VENDOR\";\n  const VE = \"VENDEE\";\n  const considerationText = `${saleStr} ${words}`;\n\n  return (\n    <>\n      <style>{deedCss + screenCss + printCss}</style>\n      <div ref={ref} id=\"deed-pages\">\n        {/* PAGE -::2::- : property description and duty */}\n        <Page docNo={2}>\n          <p className=\"center small\" style={{ marginBottom: 16 }}>(1st page being e-stamp)</p>\n          <p className=\"center\" style={{ marginBottom: 10 }}>\n            <b><u>SALE DEED FOR {c.consideration ? `Rs.${inr(c.consideration)}/-` : \"Rs. ____________/-\"}</u></b>\n          </p>\n          <p className=\"center small\" style={{ marginBottom: 0 }}><u>Description of property</u></p>\n          <table className=\"desc\" border={1} cellSpacing={0} cellPadding={5}>\n            <tbody>\n              {([\n                [\"Name of The Colony\", U(d.colony)],\n                [\"Category\", d.category.trim() ? `“${d.category.trim().toUpperCase()}“` : BLANK],\n                [\"Total Area of Property\", `${inr(c.sqm)} Sq.Mtrs.`],\n                [\"Total Plinth Area\", `${c.plinthTotal.toFixed(2)} Sq.Mtrs.`],\n                [\"Plinth Area Under Sale\", `${inr(c.plinthSale)} Sq.Mtrs.`],\n                [\"Land Use\", d.landUse || \"Residential\"],\n                [\"Number of Floor\", c.floors === 4 ? \"Four (4)\" : `${inr(c.floors)} (${inr(c.floors)})`],\n                [\"Minimum price of land fixed by the Govt.\", `${rs(c.landRate)} Per Sq. Mtrs.`],\n                [\"Minimum value of land\", `${inr(c.sqm)} X ${inr(c.landRate)}/- / ${inr(c.floors || 1)} = ${rs(c.landValue)}`],\n                [\"Minimum Cost of Cons. Notified By Govt.\", `${rs(c.consRate)} Per Sq. Mtrs.`],\n                [\"Minimum Value of Construction\", `${inr(c.sqm)} X ${inr(c.consRate)}/- = ${rs(c.consValue)}`],\n                [\"Parking Duty\", `${inr(c.parkingArea)} X ${inr(c.consRate)}/- = ${rs(c.parkingDuty)}`],\n                [\"Minimum Value of Property\", rs(c.totalValue)],\n                [\"Total Sale Consideration\", saleStr],\n              ] as [string, string][]).map(([k, v]) => (\n                <tr key={k}><td style={{ width: \"50%\" }}>{k}</td><td>: &nbsp;{v}</td></tr>\n              ))}\n            </tbody>\n          </table>\n          <div style={{ marginTop: 24 }} className=\"right\">\n            <p className=\"small\" style={{ marginBottom: 5 }}>{category}</p>\n            <p className=\"small\" style={{ marginBottom: 5 }}>Stamp Duty @ {c.stampPct} % {rs(c.stamp)}</p>\n            <p className=\"small\" style={{ marginBottom: 5 }}>Corporation Tax @ {c.corpPct} % {rs(c.corp)}</p>\n            <p className=\"small\" style={{ marginBottom: 0 }}>____________________________</p>\n            <p className=\"small\" style={{ marginBottom: 0 }}>Total Duty @ {pctTotal} % {rs(c.totalDuty)}</p>\n            <p className=\"small\" style={{ marginBottom: 0 }}>____________________________</p>\n          </div>\n          <p className=\"continuation\">Contd...3/-</p>\n        </Page>\n\n        {/* PAGE -::3::- : parties, property, boundaries and GPA */}\n        <Page docNo={3}>\n          <p>\n            This Sale Deed is executed at {d.place || \"New Delhi\"} on this {dateText(d.date)} by:-\n          </p>\n          <p>\n            <b>{partiesText(d.sellers)}</b>, (hereinafter referred to as the “{V}”) which expression shall mean and include {sellerP.poss} heirs, successors, legal representatives, administrators, executors, nominees and assigns.\n          </p>\n          <p className=\"center\"><b><u>IN FAVOUR OF</u></b></p>\n          <p>\n            <b>{partiesText(d.buyers)}</b>, (hereinafter referred to as the “{VE}”) which expression shall mean and include {buyerP.poss} heirs, successors, legal representatives, administrators, executors, nominees and assigns.\n          </p>\n          <p>\n            WHEREAS the {V} is the sole, absolute and exclusive owner and in possession of <b>{prop}</b>, with all free hold rights of the land underneath and the same is bounded as under:-\n          </p>\n          <table className=\"bounds\">\n            <tbody>\n              <tr><td style={{ width: \"50%\" }}>EAST &nbsp;&nbsp;:- {U(d.east, \"__________\")}</td><td>WEST &nbsp;&nbsp;:- {U(d.west, \"__________\")}</td></tr>\n              <tr><td>NORTH &nbsp;:- {U(d.north, \"__________\")}</td><td>SOUTH &nbsp;&nbsp;:- {U(d.south, \"__________\")}</td></tr>\n            </tbody>\n          </table>\n          <p>\n            (hereinafter referred to as the “Said Property”) Vide GPA duly notarized by the Notary Public {notaryCity}, having purchased from {U(d.prevOwner, \"________________\")} to do all acts, deeds and things including the power to sell and transfer the same in any manner.\n          </p>\n          <p className=\"continuation\">Cont...4/-</p>\n        </Page>\n\n        {/* PAGE -::4::- : recitals */}\n        <Page docNo={4}>\n          <p>\n            AND WHEREAS the {V} has full power and absolute authority to sell and transfer the aforesaid property unto the {VE}, and to receive the sale consideration in {sellerP.poss} own name. And neither anyone else has any right, title and interest in the aforesaid property nor there is any legal impediment which prohibits the {V} to sell the same unto the {VE}.\n          </p>\n          <p>\n            AND WHEREAS the {V} has agreed to sell, convey, transfer and assign {sellerP.poss} all rights, titles and interests of <b>{prop}</b>, along with proportionate undivided, indivisible and impartible ownership rights in the land beneath the same and with right to park One Bike Parking at stilt floor with all right of possession, privileges, easement and appurtenances, with all fittings, fixtures, overhead water tank, connections, structure standing thereon, with all rights in common entrances, passages, staircase and other common facilities, privileges, easements or advantages belonging to or in any way appertaining to the said property to the {VE} for a total sale consideration of <b>{considerationText}</b>, with all free hold rights of the land underneath and the same is bounded as under:-\n          </p>\n          <table className=\"bounds\">\n            <tbody>\n              <tr><td style={{ width: \"50%\" }}>EAST &nbsp;&nbsp;:- {U(d.east, \"__________\")}</td><td>WEST &nbsp;&nbsp;:- {U(d.west, \"__________\")}</td></tr>\n              <tr><td>NORTH &nbsp;:- {U(d.north, \"__________\")}</td><td>SOUTH &nbsp;&nbsp;:- {U(d.south, \"__________\")}</td></tr>\n            </tbody>\n          </table>\n          <p>\n            AND WHEREAS the {VE} has agreed to purchase, acquire and possess the said property relying on the various assurances, covenants, representations, statements and undertaking given by the {V} and believing the same to be true and acting on the faith thereof and on the terms and conditions mentioned hereunder.\n          </p>\n          <p className=\"continuation\">Contd...5/-</p>\n        </Page>\n\n        {/* PAGE -::5::- : conditions 1-4 */}\n        <Page docNo={5}>\n          <p style={{ marginBottom: 14 }}><b><u>NOW THIS SALE DEED WITNESSETH AS UNDER:-</u></b></p>\n          <p className=\"cl\">\n            1. That in consideration of the said sum of <b>{considerationText}</b>, the {V} does hereby sell, convey, alienate and transfer all {sellerP.poss} rights, titles and interests in the said property, along with boundary wall, fittings, fixtures and super structure thereon and all other estate rights whatsoever, including all easements, appurtenances to the said property as also enjoyed or reputed to be enjoyed therewith unto the {VE}, in perfect and absolute ownership without any hindrance, disturbance, whatsoever, TO HAVE, TO HOLD AND TO ENJOY THE SAME ABSOLUTELY AND FOREVER.\n          </p>\n          <p className=\"cl\">\n            2. That the said consideration of <b>{considerationText}</b> has already been paid by the {VE} to the {V} in following manners:-\n          </p>\n          <table className=\"payment-table\">\n            <tbody><tr><td>Amount</td><td>Chq./D.D./P.O. No.</td><td>Dated</td><td>Name of Bank</td></tr><tr><td>&nbsp;</td><td></td><td></td><td></td></tr></tbody>\n          </table>\n          <p>\n            as full and final payment/settlement towards the sale price of the said property, and the legal receipt of the same is hereby admitted and acknowledged in respect of the sale of the said portion of the said property in full payment and/or settlement by the {V}.\n          </p>\n          <p className=\"cl\">\n            3. That the {V} hereby explicitly admits and declares that having received the aforesaid consideration in full and final payment, now nothing is left due from the {VE} to the {V} against sale consideration for the purchase of the said property, as the aforesaid consideration represents the full and final consideration for the transaction.\n          </p>\n          <p className=\"cl\">\n            4. That the {V} has delivered the peaceful and actual physical vacant possession of the said property unto the {VE} on the spot.\n          </p>\n          <p className=\"continuation\">Contd...6/-</p>\n        </Page>\n\n        {/* PAGE -::6::- : conditions 5-8 */}\n        <Page docNo={6}>\n          <p className=\"cl\">\n            5. That the {V} does hereby sell, grant, convey, transfer and assign, with the ownership rights of the said property together with the super structure thereon, unto the {VE}, and the {V} hereby transfer {sellerP.poss} all rights titles and interests, along with all the rights, privileges, easements and appurtenances, whatsoever in the said property, belong and usually held herewith including all electric, water and all the estate right, title, and interest in the said property, hereby conveyed, and every part thereof TO HAVE AND TO HOLD THE SAME unto the {VE} absolutely and forever.\n          </p>\n          <p className=\"cl\">\n            6. That the {V} hereby assures the {VE} that the said property, hereby conveyed, is free from all sorts of charges, encumbrances, liens, loan, claims, demands, and liabilities, surety, security, legal flaws, disputes, sale, mortgage, gift, liabilities, disabilities, injunction, notifications for acquisitions/requisition, and if ever it is proved to be otherwise and the {VE} suffers, due to any legal defect in the title of the {V}, any loss and/or whole or any part of the said property, hereby conveyed, is taken away from the possession of the {VE}, then the {V} will make good the losses thus suffered by the {VE} in this regard and shall keep the {VE} indemnified against all losses, costs, damages and expenses accruing thereby to the {VE}.\n          </p>\n          <p className=\"cl\">\n            7. That the {V} hereby further assures the {VE} that {sellerP.subj} or anyone else claiming from or through the {V} has not created any encumbrances or license or restriction thereon nor is there any claim or litigation or legal proceeding injunction or attachment concerning the said property.\n          </p>\n          <p className=\"cl\">\n            8. That the {V} now admits that {sellerP.subj} has been left with no right, title and interest of any nature, whatsoever may be in the said property, and the {VE} has become the absolute owner of the same. {buyerP.subj.charAt(0).toUpperCase() + buyerP.subj.slice(1)} will use and enjoy the same in any manner, {buyerP.subj} likes, including right to sell, transfer or alienate the said property to anyone including the right to give the same on rent to anyone and to receive the rent and profit to the tenant(s) evicted through the process of law or by negotiation, to take possession etc.\n          </p>\n          <p className=\"continuation\">Contd...7/-</p>\n        </Page>\n\n        {/* PAGE -::7::- : conditions 9-15 */}\n        <Page docNo={7}>\n          <p className=\"cl2\">\n            9. That the {VE} can get the mutation of the said property in {buyerP.poss} own name in the absence of the {V} on the basis of this sale deed or its certified true copy in the MCD or concerned authorities.\n          </p>\n          <p className=\"cl2\">\n            10. That the {V} or any other person/s claiming under or through the {V} shall be required by the {VE} then the {V} shall co-operate with the {VE} at the {VE}'s cost and do all acts and execute all documents required by the concerned authorities for more fully effectuating the sale being hereby made or for more fully owning and enjoying the said property or defending any action or proceeding concerning the same.\n          </p>\n          <p className=\"cl2\">\n            11. That the {V} will be responsible for the payment of the rates, cesses, taxes, payable in respect of the said property, up to date, and thereafter the {VE} will be responsible for the payment of the same.\n          </p>\n          <p className=\"cl2\">\n            12. That the {VE} can apply for and get the fresh electricity and water connection installed in the said property or can get the existing electricity and water connections along with their security amount transferred in {buyerP.poss} own name from the concerned authority by presenting this sale deed or its certified true copy and this sale deed shall be deemed and construed to grant the No Objection Certificate by the {V} in favour of the {VE}.\n          </p>\n          <p className=\"cl2\">\n            13. That all the occupants of the said building shall bear proportionate expenses for the maintenance and repair of common amenities and services of the said building.\n          </p>\n          <p className=\"cl2\">\n            14. That the {VE} shall have proportionate right in the land of the property (according to {buyerP.poss} ownership) whenever property/building collapses due to any calamity like earthquake, flood, fire etc.\n          </p>\n          <p className=\"cl2\">\n            15. That it has been agreed that the {VE} or any other occupant/owner of the building will not obstruct the staircase or common passage etc. by keeping dustbin or any kind of item.\n          </p>\n          <p className=\"continuation\">Contd...8/-</p>\n        </Page>\n\n        {/* PAGE -::8::- : conditions 16-20 */}\n        <Page docNo={8}>\n          <p className=\"cl2\">\n            16. That the {VE} or any other occupant/owner of the building shall not be entitled or disturb/remove the basic and fundamental structure such as columns, beams, and facing walls of the building.\n          </p>\n          <p className=\"cl2\">\n            17. That the owners/occupants of upper ground, first and second floors can go on the roof of the top floor of the said property for the installation/inspection/repair of their water tank &amp; T.V./Dish Antenna at any reasonable hours.\n          </p>\n          <p className=\"cl2\">\n            18. That any error or omission or mis-description of the property under sale regarding the numbers or any references to the number of documents, books, volumes or pages of Registrar's office, regarding the title deed of the said property shall not annul the said deed and if such error or mis-description is material one, the {VE} will be entitled to get it removed by the {V} or {sellerP.poss} attorney by obtaining further necessary deed of assurance of supplementary deed at the cost of the {VE}.\n          </p>\n          <p className=\"cl2\">\n            19. That the {V} and the {VE} have signed this Sale Deed without any pressure, influence, coercion from any side after understanding its contents which have been fully explained to the {V} and the {VE} in vernacular and which admitted as true and correct.\n          </p>\n          <p className=\"cl2\">\n            20. That the {VE} has paid the stamp duty, transfer duty, registration charges and other incidental charges for the execution of this Sale deed.\n          </p>\n          <p className=\"continuation\">Contd...9/-</p>\n        </Page>\n\n        {/* PAGE -::9::- : clause 21 and signatures */}\n        <Page docNo={9}>\n          <p className=\"cl2\">\n            21. That both the parties, hereto i.e. the {V} and the {VE} are Indian National.\n          </p>\n          <p style={{ marginBottom: 12 }}>\n            IN WITNESS WHEREOF, the {V} and the {VE} have set subscribed their hands to this sale deed on the day, month and year, first mentioned above, in the presence of the following witnesses.\n          </p>\n          <p style={{ marginBottom: 8, fontSize: \"9.5pt\" }}>WITNESSES:-</p>\n          <WitnessBlock w={d.witness1} idx={1} role={V} />\n          <WitnessBlock w={d.witness2} idx={2} role={VE} />\n        </Page>\n      </div>\n    </>\n  );\n});\n\nexport default DeedPages;\n", "/src/App.tsx": "import { useEffect, useMemo, useRef, useState } from \"react\";\nimport DeedPages from \"./components/DeedPages\";\nimport {\n  RELATIONS,\n  TITLES,\n  blankDeed,\n  calculate,\n  emptyParty,\n  inr,\n  sampleDeed,\n  wordsIN,\n} from \"./utils/deed\";\nimport type { Deed, Gender, Party, Witness } from \"./utils/deed\";\nimport { deedCss, wordCss } from \"./deedStyles\";\n\nconst STORAGE_KEY = \"sale-deed-generator-v1\";\nconst PAGE_PX = 794; // 210mm @ 96dpi\n\n/* ---------------- small UI atoms ---------------- */\n\nconst inputCls =\n  \"w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200\";\n\nfunction Field({\n  label,\n  value,\n  onChange,\n  placeholder,\n  type = \"text\",\n  hint,\n  className = \"\",\n}: {\n  label: string;\n  value: string;\n  onChange: (v: string) => void;\n  placeholder?: string;\n  type?: string;\n  hint?: string;\n  className?: string;\n}) {\n  return (\n    <label className={`block ${className}`}>\n      <span className=\"mb-1 block text-xs font-medium text-slate-600\">{label}</span>\n      <input\n        type={type}\n        value={value}\n        placeholder={placeholder}\n        onChange={(e) => onChange(e.target.value)}\n        className={inputCls}\n      />\n      {hint && <span className=\"mt-1 block text-[11px] text-slate-400\">{hint}</span>}\n    </label>\n  );\n}\n\nfunction Select({\n  label,\n  value,\n  options,\n  onChange,\n  className = \"\",\n}: {\n  label: string;\n  value: string;\n  options: string[];\n  onChange: (v: string) => void;\n  className?: string;\n}) {\n  return (\n    <label className={`block ${className}`}>\n      <span className=\"mb-1 block text-xs font-medium text-slate-600\">{label}</span>\n      <select value={value} onChange={(e) => onChange(e.target.value)} className={inputCls}>\n        {options.map((o) => (\n          <option key={o}>{o}</option>\n        ))}\n      </select>\n    </label>\n  );\n}\n\nfunction Section({\n  step,\n  title,\n  subtitle,\n  children,\n}: {\n  step: number;\n  title: string;\n  subtitle?: string;\n  children: React.ReactNode;\n}) {\n  return (\n    <section className=\"rounded-2xl border border-slate-200 bg-white p-4 shadow-sm\">\n      <div className=\"mb-4 flex items-start gap-3\">\n        <span className=\"flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-indigo-600 text-xs font-bold text-white\">\n          {step}\n        </span>\n        <div>\n          <h2 className=\"text-sm font-semibold text-slate-900\">{title}</h2>\n          {subtitle && <p className=\"text-xs text-slate-500\">{subtitle}</p>}\n        </div>\n      </div>\n      <div className=\"space-y-3\">{children}</div>\n    </section>\n  );\n}\n\nfunction PartyEditor({\n  label,\n  role,\n  parties,\n  onChange,\n}: {\n  label: string;\n  role: string;\n  parties: Party[];\n  onChange: (p: Party[]) => void;\n}) {\n  const set = (i: number, patch: Partial<Party>) =>\n    onChange(parties.map((p, idx) => (idx === i ? { ...p, ...patch } : p)));\n\n  const setGender = (i: number, g: Gender) => {\n    const p = parties[i];\n    const patch: Partial<Party> = { gender: g };\n    if (g === \"M\") {\n      if (p.title === \"SMT.\" || p.title === \"MS.\" || p.title === \"MRS.\" || p.title === \"KUMARI\") patch.title = \"SHRI\";\n      if (p.relation === \"WIFE OF\" || p.relation === \"DAUGHTER OF\" || p.relation === \"WIDOW OF\") patch.relation = \"SON OF\";\n    } else {\n      if (p.title === \"SHRI\" || p.title === \"MR.\") patch.title = \"SMT.\";\n      if (p.relation === \"SON OF\") patch.relation = \"WIFE OF\";\n    }\n    set(i, patch);\n  };\n\n  return (\n    <div className=\"space-y-3\">\n      {parties.map((p, i) => (\n        <div key={i} className=\"rounded-xl border border-slate-200 bg-slate-50 p-3\">\n          <div className=\"mb-2 flex items-center justify-between\">\n            <span className=\"text-xs font-semibold uppercase tracking-wide text-indigo-700\">\n              {label} {parties.length > 1 ? i + 1 : \"\"}\n            </span>\n            {parties.length > 1 && (\n              <button\n                onClick={() => onChange(parties.filter((_, idx) => idx !== i))}\n                className=\"text-xs font-medium text-rose-600 hover:underline\"\n              >\n                Remove\n              </button>\n            )}\n          </div>\n          <div className=\"grid grid-cols-2 gap-2\">\n            <div className=\"col-span-2 flex gap-2\">\n              {([\"M\", \"F\"] as Gender[]).map((g) => (\n                <button\n                  key={g}\n                  onClick={() => setGender(i, g)}\n                  className={`flex-1 rounded-lg border px-3 py-1.5 text-xs font-medium transition ${\n                    p.gender === g\n                      ? \"border-indigo-600 bg-indigo-600 text-white\"\n                      : \"border-slate-300 bg-white text-slate-600 hover:bg-slate-100\"\n                  }`}\n                >\n                  {g === \"M\" ? \"Male\" : \"Female\"}\n                </button>\n              ))}\n            </div>\n            <Select label=\"Title\" value={p.title} options={TITLES} onChange={(v) => set(i, { title: v })} />\n            <Field label=\"Full name\" value={p.name} onChange={(v) => set(i, { name: v })} placeholder=\"e.g. RAMESH KUMAR\" />\n            <Select\n              label=\"Relation\"\n              value={p.relation}\n              options={RELATIONS}\n              onChange={(v) => set(i, { relation: v })}\n            />\n            <Field\n              label={`${p.relation.toLowerCase().replace(/^./, (c) => c.toUpperCase())} (name)`}\n              value={p.relName}\n              onChange={(v) => set(i, { relName: v })}\n              placeholder=\"e.g. SHRI MOHAN LAL\"\n            />\n            <label className=\"col-span-2 block\">\n              <span className=\"mb-1 block text-xs font-medium text-slate-600\">Full address ({role})</span>\n              <textarea\n                rows={2}\n                value={p.address}\n                onChange={(e) => set(i, { address: e.target.value })}\n                placeholder=\"House no., street, colony, city - PIN\"\n                className={inputCls}\n              />\n            </label>\n          </div>\n        </div>\n      ))}\n      <button\n        onClick={() => onChange([...parties, emptyParty(\"M\")])}\n        className=\"w-full rounded-lg border border-dashed border-slate-300 py-2 text-xs font-medium text-slate-600 hover:border-indigo-400 hover:text-indigo-600\"\n      >\n        + Add another {label.toLowerCase()}\n      </button>\n    </div>\n  );\n}\n\nfunction WitnessEditor({\n  title,\n  w,\n  onChange,\n}: {\n  title: string;\n  w: Witness;\n  onChange: (w: Witness) => void;\n}) {\n  const set = (patch: Partial<Witness>) => onChange({ ...w, ...patch });\n  return (\n    <div className=\"rounded-xl border border-slate-200 bg-slate-50 p-3\">\n      <div className=\"mb-2 text-xs font-semibold uppercase tracking-wide text-indigo-700\">{title}</div>\n      <div className=\"grid grid-cols-2 gap-2\">\n        <Field label=\"Name\" value={w.name} onChange={(v) => set({ name: v })} placeholder=\"SHRI ...\" />\n        <Field label=\"S/O – D/O – W/O\" value={w.parentage} onChange={(v) => set({ parentage: v })} placeholder=\"S/O SHRI ...\" />\n        <label className=\"col-span-2 block\">\n          <span className=\"mb-1 block text-xs font-medium text-slate-600\">Address</span>\n          <textarea rows={2} value={w.address} onChange={(e) => set({ address: e.target.value })} className={inputCls} />\n        </label>\n        <Field className=\"col-span-2\" label=\"Aadhar No.\" value={w.aadhar} onChange={(v) => set({ aadhar: v })} placeholder=\"0000-0000-0000\" />\n      </div>\n    </div>\n  );\n}\n\n/* ---------------- Word export ---------------- */\n\nfunction exportWord(container: HTMLElement, fileName: string) {\n  const pages = Array.from(container.querySelectorAll(\".deed-page\")).map((el) => el.outerHTML);\n  const body = pages.join(\n    `<br clear=\"all\" style=\"mso-special-character:line-break;page-break-before:always\">`\n  );\n  const html = `<html xmlns:o=\"urn:schemas-microsoft-com:office:office\" xmlns:w=\"urn:schemas-microsoft-com:office:word\" xmlns=\"http://www.w3.org/TR/REC-html40\">\n<head><meta charset=\"utf-8\"><title>Sale Deed</title>\n<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->\n<style>${deedCss}${wordCss}</style></head>\n<body><div class=\"Section1\">${body}</div></body></html>`;\n  const blob = new Blob([\"\\ufeff\", html], { type: \"application/msword\" });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement(\"a\");\n  a.href = url;\n  a.download = fileName;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 1000);\n}\n\n/* ---------------- App ---------------- */\n\nexport default function App() {\n  const [deed, setDeed] = useState<Deed>(() => {\n    try {\n      const raw = localStorage.getItem(STORAGE_KEY);\n      if (raw) return { ...blankDeed(), ...JSON.parse(raw) } as Deed;\n    } catch {\n      /* ignore */\n    }\n    return sampleDeed();\n  });\n  const [tab, setTab] = useState<\"form\" | \"preview\">(\"form\");\n  const [zoom, setZoom] = useState(1);\n  const previewRef = useRef<HTMLDivElement>(null);\n  const pagesRef = useRef<HTMLDivElement>(null);\n\n  const set = (patch: Partial<Deed>) => setDeed((d) => ({ ...d, ...patch }));\n  const c = useMemo(() => calculate(deed), [deed]);\n\n  useEffect(() => {\n    try {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify(deed));\n    } catch {\n      /* ignore */\n    }\n  }, [deed]);\n\n  useEffect(() => {\n    const el = previewRef.current;\n    if (!el) return;\n    const update = () => setZoom(Math.min(1, Math.max(0.3, (el.clientWidth - 32) / PAGE_PX)));\n    update();\n    const ro = new ResizeObserver(update);\n    ro.observe(el);\n    return () => ro.disconnect();\n  }, [tab]);\n\n  const fileName = `Sale_Deed_${(deed.colony || \"Property\").trim().replace(/\\s+/g, \"_\")}.doc`;\n\n  return (\n    <div className=\"flex min-h-screen flex-col bg-slate-100 print:block print:h-auto print:bg-white lg:h-screen\">\n      {/* Header */}\n      <header className=\"z-10 flex flex-wrap items-center gap-3 border-b border-slate-200 bg-white px-4 py-3 print:hidden\">\n        <div className=\"flex items-center gap-3\">\n          <div className=\"flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 text-white\">\n            <svg viewBox=\"0 0 24 24\" className=\"h-5 w-5\" fill=\"none\" stroke=\"currentColor\" strokeWidth={2} strokeLinecap=\"round\" strokeLinejoin=\"round\">\n              <path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\" />\n              <path d=\"M14 2v6h6M8 13h8M8 17h8M8 9h2\" />\n            </svg>\n          </div>\n          <div>\n            <h1 className=\"text-base font-bold leading-tight text-slate-900\">Sale Deed Generator</h1>\n            <p className=\"text-xs text-slate-500\">8-page A4 document • auto calculation</p>\n          </div>\n        </div>\n\n        <div className=\"ml-auto flex flex-wrap items-center gap-2\">\n          <button\n            onClick={() => setDeed(sampleDeed())}\n            className=\"rounded-lg border border-slate-300 px-3 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50\"\n          >\n            Load sample\n          </button>\n          <button\n            onClick={() => {\n              if (confirm(\"Clear all entered details?\")) setDeed(blankDeed());\n            }}\n            className=\"rounded-lg border border-slate-300 px-3 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50\"\n          >\n            Clear form\n          </button>\n          <button\n            onClick={() => pagesRef.current && exportWord(pagesRef.current, fileName)}\n            className=\"rounded-lg bg-blue-600 px-4 py-2 text-xs font-semibold text-white shadow-sm hover:bg-blue-700\"\n          >\n            ⬇ Download Word (.doc)\n          </button>\n          <button\n            onClick={() => window.print()}\n            className=\"rounded-lg bg-indigo-600 px-4 py-2 text-xs font-semibold text-white shadow-sm hover:bg-indigo-700\"\n          >\n            🖨 Print / Save PDF\n          </button>\n        </div>\n\n        {/* mobile tabs */}\n        <div className=\"flex w-full rounded-lg bg-slate-100 p-1 lg:hidden\">\n          {([\"form\", \"preview\"] as const).map((t) => (\n            <button\n              key={t}\n              onClick={() => setTab(t)}\n              className={`flex-1 rounded-md py-1.5 text-xs font-semibold capitalize ${\n                tab === t ? \"bg-white text-indigo-700 shadow-sm\" : \"text-slate-500\"\n              }`}\n            >\n              {t === \"form\" ? \"Fill details\" : \"Preview (8 pages)\"}\n            </button>\n          ))}\n        </div>\n      </header>\n\n      <main className=\"grid min-h-0 flex-1 grid-cols-1 print:block lg:grid-cols-[440px_1fr]\">\n        {/* ---------- FORM ---------- */}\n        <aside\n          className={`min-h-0 space-y-4 overflow-y-auto border-r border-slate-200 bg-slate-50 p-4 print:hidden ${\n            tab === \"form\" ? \"block\" : \"hidden lg:block\"\n          }`}\n        >\n          <Section step={1} title=\"Value & area (Page 1)\" subtitle=\"Everything on the description page is calculated automatically.\">\n            <div className=\"grid grid-cols-2 gap-2\">\n              <Field className=\"col-span-2\" label=\"Sale consideration (Rs.)\" type=\"number\" value={deed.consideration} onChange={(v) => set({ consideration: v })} placeholder=\"2500000\" hint={deed.consideration ? `Rupees ${wordsIN(Number(deed.consideration))} only` : undefined} />\n              <Field label=\"Plot area (sq. yards)\" type=\"number\" value={deed.plotYds} onChange={(v) => set({ plotYds: v })} placeholder=\"50\" />\n              <Field label=\"1 sq.yd = sq.mtr\" type=\"number\" value={deed.sqmFactor} onChange={(v) => set({ sqmFactor: v })} />\n              <Field label=\"No. of floors (plinth × )\" type=\"number\" value={deed.floors} onChange={(v) => set({ floors: v })} />\n              <Field label=\"Category\" value={deed.category} onChange={(v) => set({ category: v })} placeholder=\"G\" />\n              <Field label=\"Land rate / sq.mtr (Rs.)\" type=\"number\" value={deed.landRate} onChange={(v) => set({ landRate: v })} placeholder=\"46200\" />\n              <Field label=\"Construction rate / sq.mtr\" type=\"number\" value={deed.consRate} onChange={(v) => set({ consRate: v })} />\n              <Field label=\"Corporation duty %\" type=\"number\" value={deed.corpPct} onChange={(v) => set({ corpPct: v })} />\n              <Field label=\"Stamp duty %\" type=\"number\" value={deed.stampPct} onChange={(v) => set({ stampPct: v })} />\n              <Field className=\"col-span-2\" label=\"Land use\" value={deed.landUse} onChange={(v) => set({ landUse: v })} />\n            </div>\n\n            {/* live calc */}\n            <div className=\"rounded-xl bg-indigo-50 p-3 text-xs text-indigo-900\">\n              <div className=\"mb-2 font-semibold\">Live calculation</div>\n              <dl className=\"grid grid-cols-[1fr_auto] gap-x-3 gap-y-1\">\n                <dt>{c.yds} sq.yds →</dt>\n                <dd className=\"font-semibold\">{inr(c.sqm)} Sq.Mtr.</dd>\n                <dt>Total plinth area ({inr(c.floors)} floors)</dt>\n                <dd className=\"font-semibold\">{inr(c.plinthTotal)} Sq.Mtr.</dd>\n                <dt>Value of land</dt>\n                <dd className=\"font-semibold\">Rs.{inr(c.landValue)}</dd>\n                <dt>Value of construction</dt>\n                <dd className=\"font-semibold\">Rs.{inr(c.consValue)}</dd>\n                <dt>Parking duty / area ({inr(c.parkingArea)} Sq.Mtr.)</dt>\n                <dd className=\"font-semibold\">Rs.{inr(c.parkingDuty)}</dd>\n                <dt>Total value of property</dt>\n                <dd className=\"font-semibold\">Rs.{inr(c.totalValue)}</dd>\n                <dt>Duty charged on (higher of value / price)</dt>\n                <dd className=\"font-semibold\">Rs.{inr(c.dutyBase)}</dd>\n                <dt className=\"border-t border-indigo-200 pt-1\">Total duty ({c.corpPct + c.stampPct}%)</dt>\n                <dd className=\"border-t border-indigo-200 pt-1 font-bold\">Rs.{inr(c.totalDuty)}</dd>\n              </dl>\n            </div>\n          </Section>\n\n          <Section step={2} title=\"Deed date & place (Page 2)\">\n            <div className=\"grid grid-cols-2 gap-2\">\n              <Field label=\"Executed at\" value={deed.place} onChange={(v) => set({ place: v })} />\n              <Field label=\"Date\" type=\"date\" value={deed.date} onChange={(v) => set({ date: v })} hint=\"Leave empty for a blank date\" />\n            </div>\n          </Section>\n\n          <Section step={3} title=\"Seller / Vendor details\" subtitle=\"Name, S/o – D/o – W/o – C/o and full address.\">\n            <PartyEditor label=\"Seller\" role=\"seller\" parties={deed.sellers} onChange={(sellers) => set({ sellers })} />\n          </Section>\n\n          <Section step={4} title=\"Buyer / Vendee details\" subtitle=\"Name, S/o – D/o – W/o – C/o and full address.\">\n            <PartyEditor label=\"Buyer\" role=\"buyer\" parties={deed.buyers} onChange={(buyers) => set({ buyers })} />\n          </Section>\n\n          <Section step={5} title=\"Property address\" subtitle=\"Used on pages 1, 2 and 3.\">\n            <div className=\"grid grid-cols-2 gap-2\">\n              <Field label=\"Property no.\" value={deed.propNo} onChange={(v) => set({ propNo: v })} placeholder=\"RZ-28/195\" />\n              <Field label=\"Gali / street\" value={deed.gali} onChange={(v) => set({ gali: v })} placeholder=\"GALI NO 14\" />\n              <Field className=\"col-span-2\" label=\"Floor\" value={deed.floor} onChange={(v) => set({ floor: v })} placeholder=\"ENTIRE THIRD FLOOR WITH ROOF RIGHTS\" />\n              <Field label=\"Khasra no.\" value={deed.khasra} onChange={(v) => set({ khasra: v })} />\n              <Field label=\"Village\" value={deed.village} onChange={(v) => set({ village: v })} />\n              <Field label=\"District / State\" value={deed.district} onChange={(v) => set({ district: v })} />\n              <Field label=\"Colony / Area\" value={deed.colony} onChange={(v) => set({ colony: v })} placeholder=\"DURGA PARK\" />\n              <Field label=\"City\" value={deed.city} onChange={(v) => set({ city: v })} />\n              <Field label=\"PIN code\" value={deed.pincode} onChange={(v) => set({ pincode: v })} />\n              <Field className=\"col-span-2\" label=\"Previous owner / GPA from (optional)\" value={deed.prevOwner} onChange={(v) => set({ prevOwner: v })} placeholder=\"SMT. VIMLA SHARMA Wife of SH. RAVINDER SHARMA\" />\n            </div>\n            <div className=\"grid grid-cols-2 gap-2 border-t border-slate-100 pt-3\">\n              <div className=\"col-span-2 text-xs font-semibold text-slate-700\">Boundaries</div>\n              <Field label=\"East\" value={deed.east} onChange={(v) => set({ east: v })} />\n              <Field label=\"West\" value={deed.west} onChange={(v) => set({ west: v })} />\n              <Field label=\"North\" value={deed.north} onChange={(v) => set({ north: v })} />\n              <Field label=\"South\" value={deed.south} onChange={(v) => set({ south: v })} />\n            </div>\n          </Section>\n\n          <Section step={6} title=\"Witness details (Last page)\">\n            <WitnessEditor title=\"Witness 1 (for Vendor)\" w={deed.witness1} onChange={(witness1) => set({ witness1 })} />\n            <WitnessEditor title=\"Witness 2 (for Vendee)\" w={deed.witness2} onChange={(witness2) => set({ witness2 })} />\n          </Section>\n\n          <p className=\"pb-6 text-center text-[11px] text-slate-400\">\n            Your data is saved automatically in this browser only.\n          </p>\n        </aside>\n\n        {/* ---------- PREVIEW ---------- */}\n        <div\n          ref={previewRef}\n          className={`min-h-0 overflow-auto bg-slate-200 p-4 print:overflow-visible print:bg-white print:p-0 ${\n            tab === \"preview\" ? \"block\" : \"hidden lg:block print:!block\"\n          }`}\n        >\n          <div className=\"zoom-wrap mx-auto\" style={{ zoom, width: PAGE_PX }}>\n            <DeedPages ref={pagesRef} deed={deed} />\n          </div>\n        </div>\n      </main>\n    </div>\n  );\n}\n"};

function resolveModule(from, specifier) {
  const base = from.slice(0, from.lastIndexOf("/") + 1);
  const parts = (base + specifier).split("/");
  const clean = [];
  for (const part of parts) {
    if (!part || part === ".") continue;
    if (part === "..") clean.pop();
    else clean.push(part);
  }
  let path = "/" + clean.join("/");
  if (!/\.(tsx?|jsx?)$/.test(path)) path += ".tsx";
  return path;
}
function stripTypeOnlyImports(source) {
  return source.replace(/^import\s+type\s+[\s\S]*?from\s+["'][^"']+["'];?\s*/gm, "");
}
(async function boot() {
  const moduleUrls = {};
  const order = ["/src/utils/deed.tsx","/src/deedStyles.tsx","/src/components/DeedPages.tsx","/src/App.tsx"];
  for (const path of order) {
    let source = SOURCES[path];
    if (typeof source !== "string") throw new Error("Missing source module: " + path);
    source = stripTypeOnlyImports(source);
    source = source.replace(/^import\s+["'][^"']+\.css["'];?\s*/gm, "");
    source = source.replace(/from\s+(["'])(\.{1,2}\/[^"']+)\1/g, (match, quote, specifier) => {
      const resolved = resolveModule(path, specifier);
      const url = moduleUrls[resolved];
      if (!url) throw new Error("Module dependency was not prepared: " + resolved + " (imported by " + path + ")");
      return 'from "' + url + '"';
    });
    const compiled = Babel.transform(source, {
      filename: path,
      sourceType: "module",
      parserOpts: { plugins: ["typescript", "jsx"] },
      presets: [
        ["env", { targets: { esmodules: true }, modules: false }],
        ["react", { runtime: "automatic" }],
        "typescript"
      ]
    }).code;
    moduleUrls[path] = URL.createObjectURL(new Blob([compiled], { type: "text/javascript" }));
  }
  const appModule = await import(moduleUrls["/src/App.tsx"]);
  const React = await import("react");
  const ReactDOM = await import("react-dom/client");
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(appModule.default));
})().catch(error => {
  console.error("Sale Deed Generator startup error:", error);
  const root = document.getElementById("root");
  root.innerHTML = "";
  const panel = document.createElement("pre");
  panel.style.cssText = "margin:24px;padding:16px;border:1px solid #fecaca;border-radius:12px;background:#fff1f2;color:#991b1b;white-space:pre-wrap;font:13px/1.5 monospace";
  panel.textContent = "The Sale Deed Generator could not start.\n\n" + (error && error.stack ? error.stack : String(error));
  root.appendChild(panel);
});
